[package]
name = "emb-app"
description = "Desktop embroidery digitizer (egui)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
emb-geom.workspace = true
emb-model.workspace = true
emb-render.workspace = true
eframe.workspace = true
egui_dock.workspace = true
egui-phosphor.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
pollster.workspace = true
emb-formats.workspace = true
emb-stitch.workspace = true
emb-letter.workspace = true
emb-art.workspace = true
emb-library.workspace = true
emb-script.workspace = true
emb-sketch.workspace = true
sysinfo.workspace = true
image.workspace = true
chrono.workspace = true
flate2.workspace = true
crc32fast.workspace = true
toml.workspace = true

# The browser trial (P15 step 1, branch trial/browser): the random numbers,
# the clock, the page and the files of the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1.1"
# Local time for the worksheets and the file headers from the clock of the
# browser.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Performance",
    "Response",
    "Storage",
    "MediaQueryList",
    "console",
] }

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true

[dev-dependencies]
emb-cli.workspace = true
