[package]
name = "emb-thumbnail"
description = "The Windows thumbnail handler: pictures of design files in Explorer (P11 Milestone 3, ADR 0046)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The DLL that Explorer loads, and a library for the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
emb-library.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
# The `implement` macro of `windows` needs this crate by name.
windows-core = "0.62"

[dev-dependencies]
emb-model.workspace = true

# Not the lints of the workspace: this crate is the one place with `unsafe`
# code (the COM interface of Windows; ADR 0046, an exception to rule 9).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
