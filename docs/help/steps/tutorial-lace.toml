# The steps of "Tutorial: a lace ornament" (tutorial-lace.md). The test
# each_tutorial_runs_in_each_language (crates/emb-app/src/
# tutorial_steps.rs) does them in each language; write_tutorial_pictures
# makes the pictures. A change of a step needs the same change in the topic
# and its translations.

# Start from the template.
[[step]]
item = ["Start from the template", 1]
command = "Design > Library and Templates > New from Template"
expect = { window = "New from Template" }

[[step]]
item = ["Start from the template", 2]
button = "Lace ornament"
expect = { fabric = "water_soluble" }

# A part of the lesson that you only read (no step of the test).
[[step]]
item = ["Start from the template", 3]

# Check it.
[[step]]
item = ["Start from the template", 4]
command = "View > Show > Thread Look"

[[step]]
button = "Thread Look"

[[step]]
test_only = true
key = "Escape"

[[step]]
picture = "lace-ornament"
around = [[-46.0, -52.0], [46.0, 46.0]]

[[step]]
item = ["Check it", 1]
command = "View > Show > Density Map"
expect = { on = "View > Show > Density Map" }

[[step]]
item = ["Check it", 3]
test_only = true
command = "View > Show > Density Map"

# A part of the lesson that you only read (no step of the test).
[[step]]
item = ["Sew it", 1]
