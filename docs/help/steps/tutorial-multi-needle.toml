# The steps of "Tutorial: a multi-needle order" (tutorial-multi-needle.md).
# The test each_tutorial_runs_in_each_language (crates/emb-app/src/
# tutorial_steps.rs) does them in each language; write_tutorial_pictures
# makes the pictures. A change of a step needs the same change in the topic
# and its translations. The settings of the steps (the needles, the stock,
# the times) are not saved: the test program does not save its settings.

# Open the club crest: four colors.
[[step]]
open = "club-crest"
expect = { objects = 4, colors = 4 }

# The machine and its needles.
[[step]]
tab = "Design"

# The hoop of the Topaz does not go on the Tajima: the smallest hoop of
# the Tajima that holds the crest.
[[step]]
choose = ["Machine", "Tajima multi-needle"]
expect = { hoop = "small_100x100" }

[[step]]
command = "Design > Machine and Hoop > Needles"
expect = { window = "Needles" }

[[step]]
set = ["Needles on the machine", "6"]

[[step]]
picture = "multi-needle-needles"
area = "windows"

[[step]]
close = "Needles"

# The threads in stock.
[[step]]
command = "Design > Orders > Thread Stock"
expect = { window = "Thread Stock" }

[[step]]
choose = ["Thread chart", "Madeira Polyneon"]

[[step]]
field = "name or code"
type = "1967"

[[step]]
button = "Add"
expect = { stock = 1 }

[[step]]
field = "name or code"
type = "1804"

[[step]]
button = "Add"
expect = { stock = 2 }

[[step]]
field = "name or code"
type = "1637"

[[step]]
button = "Add"
expect = { stock = 3 }

[[step]]
field = "name or code"
type = "1624"

[[step]]
button = "Add"
expect = { stock = 4 }

[[step]]
button = "Use Threads in Stock"
expect = { colors = 4, threads = ["Light Navy", "Blanc de Blanc", "Warm Red", "Gold"] }

[[step]]
close = "Thread Stock"

# The order.
[[step]]
command = "Design > Orders > Order Details"
expect = { window = "Order Details" }

[[step]]
set = ["Order number", "A-1042"]

[[step]]
set = ["Customer", "Riverside Football Club"]

[[step]]
set = ["Garment", "Polo shirt"]

[[step]]
set = ["Quantity", "120"]

[[step]]
close = "Order Details"

# The run time.
[[step]]
command = "Design > Machine and Hoop > Machine Settings"
expect = { window = "Machine Settings" }

[[step]]
set = ["Heads", "4"]

[[step]]
close = "Machine Settings"

# The threads to buy.
[[step]]
command = "Design > Orders > Thread Stock"
expect = { window = "Thread Stock" }

[[step]]
picture = "multi-needle-stock"
area = "windows"

[[step]]
close = "Thread Stock"

# The worksheet.
[[step]]
command = "Design > Output > Print Preview"
expect = { window = "Print Preview" }

[[step]]
picture = "multi-needle-worksheet"
area = "windows"

[[step]]
close = "Print Preview"
