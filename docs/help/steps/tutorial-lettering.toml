# The steps of "Tutorial: a name on an arc" (tutorial-lettering.md). The
# test each_tutorial_runs_in_each_language (crates/emb-app/src/
# tutorial_steps.rs) does them in each language; write_tutorial_pictures
# makes the pictures. A change of a step needs the same change in the topic
# and its translations.

# Open the start design: a construction point where the name starts.
[[step]]
item = ["Add the lettering", 1]
open = "lettering-start"
expect = { objects = 0 }

# Add the lettering.
[[step]]
item = ["Add the lettering", 2]
command = "Lettering > Lettering > Lettering"

[[step]]
item = ["Add the lettering", 3]
click = [-35.0, 10.0]
expect = { window = "Lettering" }

[[step]]
item = ["Add the lettering", 4]
type = "Anna"

[[step]]
item = ["Add the lettering", 6]
set = ["Height", "25"]

[[step]]
picture = "lettering-window"
area = "windows"

[[step]]
item = ["Add the lettering", 7]
button = "OK"
expect = { objects = 1, kinds = ["Lettering"], selected = 1 }

# Put the name on an arc.
[[step]]
item = ["Put the name on an arc", 1]
choose = ["Baseline", "Arc over"]

[[step]]
item = ["Put the name on an arc", 2]
set = ["Radius", "80"]

[[step]]
item = ["Put the name on an arc", 3]
key = "Escape"

[[step]]
command = "View > Show > Thread Look"

[[step]]
button = "Thread Look"

[[step]]
test_only = true
key = "Escape"

[[step]]
picture = "lettering-arc"
around = [[-45.0, -35.0], [45.0, 20.0]]

[[step]]
expect = { objects = 1, colors = 1, warnings = 0 }

# A part of the lesson that you only read (no step of the test).
[[step]]
item = ["The lettering kiosk", 1]
