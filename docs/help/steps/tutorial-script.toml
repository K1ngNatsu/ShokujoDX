# The steps of "Tutorial: a script that does the work" (tutorial-script.md).
# The test each_tutorial_runs_in_each_language (crates/emb-app/src/
# tutorial_steps.rs) does them in each language; write_tutorial_pictures
# makes the pictures. A change of a step needs the same change in the topic
# and its translations. The steps do not click Copy to My Scripts or Open
# Scripts Folder: they write in the folder of the user. The messages of the
# sample scripts are in English in each language (a script is a file of the
# user).

# Open the club crest: two satin columns with different spacings.
[[step]]
item = ["Open the start design", 0]
open = "club-crest"
expect = { objects = 4, colors = 4 }

# Check before output.
[[step]]
item = ["Check the design before output", 1]
command = "Edit > Scripts > Scripts"
expect = { window = "Scripts" }

[[step]]
item = ["Check the design before output", 2]
choose = ["Script", "Check Before Output"]

[[step]]
item = ["Check the design before output", 3]
set = ["Most colors", "3"]

[[step]]
item = ["Check the design before output", 4]
button = "Run Script"
expect = { shows = "4 colors: more than 3.", objects = 4 }

# The same density for all satins, in one undo step.
[[step]]
item = ["The same density for all satins", 1]
choose = ["Script", "Same Density for All Satins"]

[[step]]
item = ["The same density for all satins", 2]
set = ["Spacing (mm)", "0.4"]

[[step]]
item = ["The same density for all satins", 3]
button = "Run Script"
expect = { spacing = 0.4, shows = "2 satin columns now have a spacing of 0.4 mm." }

[[step]]
picture = "script-window"
area = "windows"

[[step]]
item = ["One undo step", 0]
command = "Undo"
expect = { objects = 4 }

[[step]]
command = "Redo"
expect = { spacing = 0.4 }

[[step]]
test_only = true
close = "Scripts"

# A part of the lesson that you only read (no step of the test).
[[step]]
item = ["A script of your own", 1]
