# The steps of "Tutorial: your first design" (tutorial-first-design.md).
# The test each_tutorial_runs_in_each_language (crates/emb-app/src/
# tutorial_steps.rs) does them in each language; write_tutorial_pictures
# makes the pictures. A change of a step needs the same change in the topic
# and its translations.

# Open the start design.
[[step]]
open = "first-steps"
expect = { objects = 0, colors = 0 }

[[step]]
picture = "first-design-start"
around = [[-42.0, -42.0], [42.0, 42.0]]

# Draw the circle.
[[step]]
thread = "Gold"

[[step]]
command = "Digitize > Shapes > Ellipse"
expect = { on = "Digitize > Shapes > Ellipse" }

[[step]]
drag = [[-30.0, -30.0], [30.0, 30.0]]
holding = ["ctrl"]
expect = { objects = 1, kinds = ["Fill"], threads = ["Gold"] }

[[step]]
key = "Escape"

[[step]]
picture = "first-design-circle"
around = [[-42.0, -42.0], [42.0, 42.0]]

# Add a satin border.
[[step]]
command = "Digitize > Select > Select"

[[step]]
click = [0.0, 0.0]
expect = { selected = 1 }

[[step]]
command = "Artwork > Borders and Offsets > Add Border"
expect = { window = "Offsets" }

[[step]]
button = "Add outlines"
expect = { objects = 2, kinds = ["Fill", "Running"], selected = 1 }

[[step]]
thread = "Navy"
expect = { threads = ["Gold", "Navy"], colors = 2 }

[[step]]
picture = "first-design-offsets"
area = "windows"

[[step]]
close = "Offsets"

# Look at the stitches.
[[step]]
command = "View > Show > Thread Look"

[[step]]
button = "Thread Look"

[[step]]
key = "Escape"

[[step]]
picture = "first-design-badge"
around = [[-42.0, -42.0], [42.0, 42.0]]

[[step]]
command = "View > Stitch Cursor > Stitch Player"
expect = { on = "View > Stitch Cursor > Stitch Player" }

# Check it.
[[step]]
expect = { objects = 2, colors = 2, stitches = [4000, 4900], size = [65.0, 65.0] }

# Save it, and write the machine file.
[[step]]
command = "Save"
check_only = true

[[step]]
command = "Design > Output > Export"
expect = { window = "Export machine file" }

[[step]]
button = "Cancel"
