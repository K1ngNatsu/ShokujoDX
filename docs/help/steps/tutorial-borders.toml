# The steps of "Tutorial: borders, motifs and families"
# (tutorial-borders.md). The test each_tutorial_runs_in_each_language
# (crates/emb-app/src/tutorial_steps.rs) does them in each language;
# write_tutorial_pictures makes the pictures. A change of a step needs the
# same change in the topic and its translations.
#
# The steps do not use the Clipart tab: the first time it shows, it writes
# the built-in clipart into the folder of the user.

# Open the start design: a circle and a line.
[[step]]
item = ["Open the start design", 0]
open = "decor-shapes"
expect = { objects = 2, kinds = ["Fill", "Running"] }

# Add a border.
[[step]]
item = ["Add a border", 1]
click = [0.0, -10.0]
expect = { selected = 1 }

[[step]]
item = ["Add a border", 2]
command = "Digitize > Decorate > Borders"
expect = { window = "Borders" }

[[step]]
item = ["Add a border", 3]
field = "Search"

[[step]]
type = "hearts"

[[step]]
button = "Hearts"

[[step]]
item = ["Add a border", 4]
set = ["Space round the objects", "3"]

[[step]]
picture = "borders-window"
area = "windows"

[[step]]
item = ["Add a border", 5]
button = "Add the border"
expect = { objects = 3, kinds = ["Fill", "Running", "Running"] }

[[step]]
item = ["Add a border", 6]
close = "Borders"

# Give a line a motif.
[[step]]
item = ["Give a line a motif", 1]
click = [0.0, 40.0]
expect = { selected = 1 }

[[step]]
item = ["Give a line a motif", 2]
command = "Edit > Stitch Types > Motifs"
expect = { window = "Motifs" }

[[step]]
item = ["Give a line a motif", 3]
button = "Scallop"

[[step]]
button = "Use for the selection"

[[step]]
item = ["Give a line a motif", 4]
click = [0.0, -10.0]
expect = { selected = 1 }

[[step]]
button = "Bead"

[[step]]
button = "Use for the selection"
expect = { objects = 3, kinds = ["Fill", "Running", "Running"] }

# A clipart item from a family.
[[step]]
item = ["A clipart item from a family", 1]
button = "Families…"
expect = { window = "Families" }

[[step]]
item = ["A clipart item from a family", 2]
button = "Clipart"

[[step]]
button = "Six-point star"

# A part of the lesson that you only read (no step of the test).
[[step]]
item = ["A clipart item from a family", 3]

[[step]]
picture = "borders-families"
area = "windows"

[[step]]
item = ["A clipart item from a family", 4]
button = "Insert"
expect = { objects = 5, kinds = ["Fill", "Running", "Running", "Fill", "Running"] }

[[step]]
item = ["A clipart item from a family", 5]
close = "Families"

[[step]]
close = "Motifs"

[[step]]
command = "View > Show > Thread Look"

[[step]]
button = "Thread Look"

[[step]]
test_only = true
key = "Escape"

[[step]]
picture = "borders-stitches"
