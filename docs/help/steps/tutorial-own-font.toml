# The steps of "Tutorial: an embroidery font of your own"
# (tutorial-own-font.md). The test each_tutorial_runs_in_each_language
# (crates/emb-app/src/tutorial_steps.rs) does them in each language;
# write_tutorial_pictures makes the pictures. A change of a step needs the
# same change in the topic and its translations.
#
# The steps do not click Convert or Save Correction: they write files in
# the folder of the fonts of the user.

[[step]]
item = ["Convert the font", 1]
test_only = true
open = "lettering-start"
expect = { objects = 0 }

# Convert the font: the settings.
[[step]]
command = "Lettering > Lettering > Fonts"
expect = { window = "Fonts" }

[[step]]
item = ["Convert the font", 2]
button = "TrueType"

[[step]]
item = ["Convert the font", 3]
field = "Search"

[[step]]
type = "Graduate"

[[step]]
button = "Graduate"

[[step]]
item = ["Convert the font", 4]
button = "Convert to embroidery font…"

[[step]]
picture = "own-font-convert"
area = "windows"

# A part of the lesson that you only read (no step of the test).
[[step]]
item = ["Convert the font", 5]

[[step]]
test_only = true
button = "Cancel"

# Make a test sheet: of an embroidery font of the program (the letters of
# a TrueType font take too long in a test).
[[step]]
item = ["Make a test sheet", 1]
test_only = true
button = "Embroidery"

[[step]]
test_only = true
field = "Search"

[[step]]
test_only = true
type = "Varsity"

[[step]]
test_only = true
button = "Varsity"

[[step]]
button = "Test Sheet…"
expect = { window = "Font Test Sheet" }

[[step]]
item = ["Make a test sheet", 2]
choose = ["Characters", "Capital letters"]

[[step]]
item = ["Make a test sheet", 3]
button = "Make Test Sheet"
expect = { objects = 2 }

[[step]]
picture = "own-font-sheet"

# Correct a letter, in a new design.
[[step]]
item = ["Correct a letter", 1]
command = "New"
expect = { objects = 0 }

[[step]]
item = ["Correct a letter", 2]
command = "Lettering > Lettering > Alphabets"
expect = { window = "Alphabets" }

[[step]]
item = ["Correct a letter", 3]
set = ["Character", "A"]

[[step]]
item = ["Correct a letter", 4]
button = "Place Letter"
expect = { objects = 4 }

[[step]]
picture = "own-font-letter"

# A part of the lesson that you only read (no step of the test).
[[step]]
item = ["Correct a letter", 5]
