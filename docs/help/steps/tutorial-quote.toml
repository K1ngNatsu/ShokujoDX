# The steps of "Tutorial: a quote with a product picture"
# (tutorial-quote.md). The test each_tutorial_runs_in_each_language
# (crates/emb-app/src/tutorial_steps.rs) does them in each language;
# write_tutorial_pictures makes the pictures. A change of a step needs the
# same change in the topic and its translations. The steps do not click
# Save Quote Sheet or Save PDF: they write files.

# Open the club crest.
[[step]]
open = "club-crest"
expect = { objects = 4, colors = 4 }

# The design on a polo shirt.
[[step]]
command = "Design > Product > Product"
expect = { window = "Product" }

[[step]]
choose = ["Product", "Polo shirt"]

[[step]]
button = "Light blue"

[[step]]
button = "Left chest"
expect = { product = ["Polo shirt", "Left chest"] }

[[step]]
button = "Zoom to product"

[[step]]
close = "Product"

[[step]]
command = "View > Workspace > Grid"

[[step]]
picture = "quote-product"

[[step]]
command = "View > Workspace > Grid"

# The prices.
[[step]]
command = "Design > Orders > Quote"
expect = { window = "Quote" }

[[step]]
set = ["Each 1000 stitches", "1.20"]

[[step]]
set = ["Lowest price for each piece", "4"]

[[step]]
set = ["Colors in the price", "3"]

[[step]]
set = ["Each added color", "0.25"]

[[step]]
set = ["Setup", "15"]

[[step]]
set = ["Digitizing", "25"]

[[step]]
button = "Add a Quantity Price"
expect = { shows = "Remove the quantity price" }

# The order.
[[step]]
set = ["Quantity", "24"]

[[step]]
button = "New design (add the digitizing price)"

[[step]]
button = "Prices"

[[step]]
picture = "quote-window"
area = "windows"

[[step]]
close = "Quote"

# The approval sheet with the product page.
[[step]]
command = "Design > Output > Print Preview"
expect = { window = "Print Preview" }

[[step]]
button = "Approval sheet"

[[step]]
button = "Next page"

[[step]]
picture = "quote-approval"
area = "windows"

[[step]]
close = "Print Preview"
