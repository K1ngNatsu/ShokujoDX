# The steps of "Tutorial: a badge in sketch mode" (tutorial-sketch.md). The
# test each_tutorial_runs_in_each_language (crates/emb-app/src/
# tutorial_steps.rs) does them in each language; write_tutorial_pictures
# makes the pictures. A change of a step needs the same change in the topic
# and its translations.

# Open the start design: no objects, three threads.
[[step]]
open = "sketch-start"
expect = { objects = 0 }

# A new sketch.
[[step]]
command = "Digitize > Sketch > Parametric Sketch"
expect = { sketch = true }

# Two circles round the origin.
[[step]]
command = "Sketch > Create > Circle"

[[step]]
clicks = [[0.0, 0.0], [30.0, 0.0]]

[[step]]
clicks = [[0.0, 0.0], [25.0, 0.0]]
expect = { regions = 2 }

# A hexagon in the middle (the polygon tool is under the arrow of the
# rectangle).
[[step]]
command = "Sketch > Create > Polygon"

[[step]]
clicks = [[0.0, 0.0], [12.0, 0.0]]
expect = { regions = 3 }

# The sizes: the diameters of the two circles.
[[step]]
command = "Sketch > Constrain > Dimension"

[[step]]
clicks = [[0.0, -30.0], [30.0, -36.0]]

[[step]]
type = "60"

[[step]]
key = "Enter"

[[step]]
clicks = [[0.0, 25.0], [30.0, 36.0]]

[[step]]
type = "52"

[[step]]
key = "Enter"

[[step]]
key = "Escape"

[[step]]
picture = "sketch-dimensions"
around = [[-45.0, -45.0], [55.0, 45.0]]

# Embroidery from the regions: the disc, the hexagon, then the ring.
[[step]]
command = "Sketch > Sketch > Regions"

[[step]]
thread = "Navy"

[[step]]
clicks = [[0.0, 18.0]]

[[step]]
button = "Fill"

[[step]]
thread = "White"

[[step]]
clicks = [[0.0, 0.0]]

[[step]]
button = "Fill"

[[step]]
thread = "Gold"

[[step]]
clicks = [[0.0, -28.0]]

[[step]]
button = "Satin"

[[step]]
command = "Sketch > Exit > Finish Sketch"
expect = { sketch = false, objects = 4, colors = 3, size = [60.0, 60.0] }

# A change of the sketch: the outer circle 66 mm.
[[step]]
click = [0.0, -28.0]
expect = { selected = 1 }

[[step]]
button = "Edit Sketch"
expect = { sketch = true }

[[step]]
clicks = [[30.0, -36.0, 1]]

[[step]]
button = "Change Value"

[[step]]
type = "66"

[[step]]
key = "Enter"

[[step]]
command = "Sketch > Exit > Finish Sketch"
expect = { sketch = false, objects = 4, colors = 3, size = [66.0, 66.0] }

[[step]]
command = "View > Show > Thread Look"

[[step]]
button = "Thread Look"

[[step]]
key = "Escape"

[[step]]
picture = "sketch-stitches"
