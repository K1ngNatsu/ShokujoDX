<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ShokujoDX (browser trial)</title>
<meta name="theme-color" content="#1e1f22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ShokujoDX">
<style>
  /* The program takes the fingers on its canvas: no scroll, zoom, bounce
     or text selection of the page (P15 step 3). */
  html, body { margin: 0; position: fixed; inset: 0; overflow: hidden;
    overscroll-behavior: none; background: #1e1f22;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none;
    touch-action: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; color: #ccc;
    font: 16px/1.6 sans-serif; text-align: center; pointer-events: none; padding: 16px;
    background: #1e1f22; transition: opacity 0.5s ease; }
  #loading.done { opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0s 0.5s; }
  /* The logo fills with the download: a dim logo, and over it the bright
     hoop in a sweep from 12 o'clock round its middle (?loader=up: from the
     bottom to the top). --p is the part of the program that came. When the
     program starts, the needle and then the star light up. */
  @property --p { syntax: "<percentage>"; inherits: true; initial-value: 0%; }
  #logo { --p: 0%; position: relative; width: min(56vw, 36vh, 260px); aspect-ratio: 1;
    transition: --p 0.35s linear; }
  #logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #logo .dim { opacity: 0.22; filter: saturate(0.5); }
  #logo .lit { filter: drop-shadow(0 0 10px rgba(156, 98, 220, 0.55)); }
  #logo .hoop {
    -webkit-mask-image: conic-gradient(from 0deg at 50% 54%, #000 calc(var(--p) - 1.5%), transparent var(--p));
    mask-image: conic-gradient(from 0deg at 50% 54%, #000 calc(var(--p) - 1.5%), transparent var(--p)); }
  /* The hoop is from 11 % to 92 % of the height of its picture (from the bottom). */
  #logo.up { --line: calc(11% + var(--p) * 0.81); }
  #logo.up .hoop {
    -webkit-mask-image: linear-gradient(to top, #000 calc(var(--line) - 1.5%), transparent calc(var(--line) + 1.5%));
    mask-image: linear-gradient(to top, #000 calc(var(--line) - 1.5%), transparent calc(var(--line) + 1.5%)); }
  #logo .needle, #logo .star { opacity: 0; transform: scale(0.92);
    transition: opacity 0.6s ease, transform 0.6s ease; }
  #logo .star { transition-delay: 0.35s; }
  #logo.starting .needle, #logo.starting .star { opacity: 1; transform: none; }
  /* Then, while the program starts, the logo breathes. */
  #logo.starting { animation: breathe 1.4s ease-in-out 1s infinite; }
  @keyframes breathe { 50% { opacity: 0.75; } }
  #status { color: #e6e6e6; font-size: 17px; min-height: 1.6em; }
  #note { color: #999; font-size: 14px; max-width: 34em; }
</style>
</head>
<body>
<canvas id="shokujodx"></canvas>
<div id="loading">
<div id="logo"><img class="dim" src="logo.svg" alt=""><img class="lit hoop" src="logo-hoop.svg" alt=""><img
class="lit needle" src="logo-needle.svg" alt=""><img class="lit star" src="logo-star.svg" alt=""></div>
<div id="status">Loading ShokujoDX…</div>
<div id="note">A trial of the program in a browser. The first visit downloads about 35 MB;
then the browser keeps it.<br>On a phone or a tablet, "Add to Home Screen" makes it an app
that also works offline.</div>
</div>
<noscript>ShokujoDX needs JavaScript and WebAssembly.</noscript>
<script type="module">
  import init from "./emb-app.js";
  // File > Check for Updates: the build of this page (tools/build-web.py
  // writes it), the newest build on the server (version.json, never from a
  // cache), and a reload that takes the newest.
  window.shokujodxBuild = { version: "@VERSION@", built: "@BUILT@", commit: "@COMMIT@" };
  window.shokujodxNewest = async () => {
    const r = await fetch("version.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  };
  window.shokujodxUpdate = async () => {
    try {
      const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
      if (reg) {
        await reg.update();
        // The new worker gets its files, then starts (web/sw.js).
        const w = reg.installing || reg.waiting;
        if (w) {
          await new Promise((done) => {
            const check = () => (w.state === "activated" || w.state === "redundant") && done();
            w.addEventListener("statechange", check);
            check();
          });
        }
      }
    } finally {
      location.reload();
    }
  };
  const logo = document.getElementById("logo");
  const status = document.getElementById("status");
  if (new URLSearchParams(location.search).get("loader") === "up") logo.classList.add("up");
  // The part of the program that came (0 to 1): the logo and the status.
  const show = (part) => {
    logo.style.setProperty("--p", (part >= 1 ? 102 : part * 100).toFixed(1) + "%");
    status.textContent = "Downloading ShokujoDX… " + Math.floor(part * 100) + " %";
  };
  // The program as a response that counts its bytes as they come, so the
  // browser still compiles it during the download. The size is the size of
  // the program after the browser unpacks it (tools/build-web.py writes it;
  // the Content-Length of a packed file is smaller).
  const counted = async (url) => {
    const r = await fetch(url);
    const total = Number("@WASM_BYTES@") || Number(r.headers.get("content-length")) || 0;
    if (!r.ok || !r.body || !total) return r;
    let got = 0;
    const reader = r.body.getReader();
    const body = new ReadableStream({
      async pull(controller) {
        const { done, value } = await reader.read();
        if (done) {
          controller.close();
          return;
        }
        got += value.byteLength;
        show(Math.min(got / total, 1));
        controller.enqueue(value);
      },
    });
    return new Response(body, { headers: { "Content-Type": "application/wasm" } });
  };
  const t0 = performance.now();
  let startingAt = null;
  const ready = (wasm) => {
    window.shokujodxLoadMs = performance.now() - t0;
    window.shokujodxMemoryMb = () => wasm.memory.buffer.byteLength / 1e6;
    show(1);
    status.textContent = "Starting…";
    logo.classList.add("starting");
    startingAt = performance.now();
  };
  // The program runs (crates/emb-app/src/web.rs calls it): the loader
  // fades out, after the needle and the star are lit (1 s after Starting).
  window.shokujodxStarted = () => {
    const wait = startingAt === null ? 0 : Math.max(0, startingAt + 1000 - performance.now());
    setTimeout(() => document.getElementById("loading").classList.add("done"), wait);
  };
  try {
    ready(await init({ module_or_path: await counted("./emb-app_bg.wasm") }));
  } catch (first) {
    // A browser that does not compile a counted response: the file again
    // (from its cache).
    try {
      ready(await init({ module_or_path: "./emb-app_bg.wasm" }));
    } catch (e) {
      logo.classList.remove("starting");
      status.textContent = "ShokujoDX did not start in this browser: " + e;
    }
  }
  // Offline use and "Add to Home Screen": a service worker keeps the files
  // of this version (only on https, so a local test build is not kept).
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
