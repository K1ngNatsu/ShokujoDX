<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ShokujoDX (browser trial)</title>
<meta name="theme-color" content="#1e1f22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ShokujoDX">
<style>
  /* The program takes the fingers on its canvas: no scroll, zoom, bounce
     or text selection of the page (P15 step 3). */
  html, body { margin: 0; position: fixed; inset: 0; overflow: hidden;
    overscroll-behavior: none; background: #1e1f22;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none;
    touch-action: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #ccc; font: 16px/1.6 sans-serif; text-align: center;
    pointer-events: none; padding: 16px; }
</style>
</head>
<body>
<canvas id="shokujodx"></canvas>
<div id="loading">ShokujoDX is loading: a trial of the program in a browser.<br>
The first visit downloads about 35 MB; then the browser keeps it.<br>
On a phone or a tablet, "Add to Home Screen" makes it an app that also works offline.</div>
<noscript>ShokujoDX needs JavaScript and WebAssembly.</noscript>
<script type="module">
  import init from "./emb-app.js";
  const loading = document.getElementById("loading");
  const t0 = performance.now();
  try {
    const wasm = await init({ module_or_path: "./emb-app_bg.wasm" });
    window.shokujodxLoadMs = performance.now() - t0;
    window.shokujodxMemoryMb = () => wasm.memory.buffer.byteLength / 1e6;
    loading.textContent = "";
  } catch (e) {
    loading.textContent = "ShokujoDX did not start in this browser: " + e;
  }
  // Offline use and "Add to Home Screen": a service worker keeps the files
  // of this version (only on https, so a local test build is not kept).
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
