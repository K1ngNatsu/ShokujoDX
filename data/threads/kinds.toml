# The kind and the weight of the threads of the thread charts of the
# program (P18 view plan, Milestone 2, ADR 0123). Each value has its
# source: here the name of the chart, as its maker names the line. A chart
# that is not in this list, and a value that is not given, has the
# default: polyester, weight 40. No chart of the program gives the weight
# of its thread in its name ("Brothread 40" is a set of 40 colors).
#
# Fields: name (the chart), kind and kind_source, weight and
# weight_source. Kinds: polyester, rayon, cotton (matte threads), metallic,
# wool (wool and acrylic), glow.

