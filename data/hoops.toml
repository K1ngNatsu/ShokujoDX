# Hoop presets.
#
# Each size is the SEWABLE FIELD in mm, not the outer frame size.
# The sizes are approximate industry sizes. Each brand has small differences.
# Verify each size against the manufacturer data before a release.
#
# Fields:
#   id                    a-z, 0-9, '_' and '-' only. Must be unique.
#   name                  Text that the app shows.
#   brand                 Optional.
#   width_mm, height_mm   Sewable field. For a circle they must be equal.
#   shape                 rectangle | rounded_rectangle | oval | circle
#   corner_radius_mm      Only for rounded_rectangle.
#   max_stitch_length_mm  Optional machine limit for this hoop.
#   [[hoop.position]]     Only for a multi-position hoop (two or more): the
#                         field that the machine sews in each position.
#                         x_mm, y_mm: the center of that field from the hoop
#                         center (Y down); width_mm, height_mm: its size. The
#                         width and height of the hoop are then the field of
#                         all positions together.
#
# Example of an oval hoop:
#   [[hoop]]
#   id = "oval_example"
#   name = "Oval 200 x 140"
#   width_mm = 200
#   height_mm = 140
#   shape = "oval"
#
# Example of a multi-position hoop (verify the sizes of your own hoop):
#   [[hoop]]
#   id = "multi_example"
#   name = "Multi-position 300 x 150"
#   width_mm = 300
#   height_mm = 150
#   shape = "rectangle"
#   [[hoop.position]]
#   x_mm = -70
#   y_mm = 0
#   width_mm = 160
#   height_mm = 150
#   [[hoop.position]]
#   x_mm = 70
#   y_mm = 0
#   width_mm = 160
#   height_mm = 150

# Husqvarna Viking names its hoops "front-to-back x left-to-right": the
# Crown hoop is 200 mm from left to right and 260 mm from the front to the
# back. The Topaz 20 shows it upright (owner test, 2026-10-23): the top of
# the design is at the back of the machine. Width is left to right, height
# is front to back.
[[hoop]]
id = "topaz20_crown"
name = "DESIGNER Crown Hoop 260 x 200"
brand = "Husqvarna Viking"
width_mm = 200
height_mm = 260
shape = "rectangle"

