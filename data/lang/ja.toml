"The design is at {} of the {}." = "デザインの位置: {}（{}）。"
"The design is empty." = "デザインが空です。"
"The designs in your design folders: thumbnails, search, sort and group. Open a design, make a new design from one, print a catalog." = "デザインフォルダー内のデザイン: サムネイル、検索、並べ替え、グループ。デザインを開く、それから新しいデザインを作る、カタログを印刷する。"
"The designs that you open and save show here." = "開いたり保存したりしたデザインがここに表示されます。"
"The direction line must go through the column." = "方向線はコラムを通る必要があります。"
"The direction of the light: 0° from the right, 90° from the top, 135° from the top left." = "光の方向: 0° は右から、90° は上から、135° は左上から。"
"The direction of the stitch rows." = "ステッチの列の方向。"
"The distance between lines, as a part of the normal line distance of the font." = "行と行の間隔。フォントの標準の行間に対する割合です。"
"The distance between stitches. A smaller value gives more stitches and a denser cover." = "ステッチの間隔。小さいほどステッチが増え、密に覆います。"
"The distance between the lines of the fill." = "塗りの線の間隔。"
"The distance between the lines of the meander." = "メアンダーの線の間隔。"
"The distance between the repeats of the pattern along the column." = "コラムに沿ったパターンの繰り返しの間隔。"
"The distance between two cuts of the needle along the line." = "線に沿った針の 2 回の切りの間隔。"
"The distance between two lines." = "2 本の線の間隔。"
"The distance between two outlines." = "2 つのアウトラインの間隔。"
"The distance from the middle of the selection to the center, which is below it." = "選択範囲の中心から、その下にある回転中心までの距離。"
"The distance is too large for these lines." = "この線には距離が大きすぎます。"
"The distance must be more than 0." = "距離は0より大きくしてください。"
"The distance of the first line from the shapes." = "形から最初の線までの距離。"
"The distance of the first outline from the objects." = "オブジェクトから最初のアウトラインまでの距離。"
"The draw tools make vector artwork (no stitches) in place of embroidery objects." = "描画ツールは、刺繍オブジェクトの代わりにベクターアートワーク（ステッチなし）を作ります。"
"The edge stitches end at random distances, for fur or grass. 0: off." = "縁のステッチがランダムな位置で終わります。毛皮や草に。0: オフ。"
"The extension of this curve meets no other curve." = "この曲線を延長しても他の曲線に届きません。"
"The fabric color inside the hoop. It changes with the colorway." = "枠内の生地の色。カラーウェイで変わります。"
"The fabric color of this piece" = "このピースの生地の色"
"The fabric sets the density, pull compensation and underlay of satin and fill stitches." = "生地により、サテンとフィルのステッチの密度、縮み補正、アンダーレイが決まります。"
"The files of the output profile (machine files, worksheets, pictures) for each selected design, in a folder." = "選択した各デザインの出力プロファイルのファイル（ミシンファイル、作業シート、画像）を 1 つのフォルダーに。"
"The fill angle follows the line. For stitches that turn with the line, set the stitch type to Satin first." = "フィルの角度が線に従います。線に沿って向きが変わるステッチにするには、先にステッチの種類をサテンにします。"
"The fill rows now follow the lines (guided fill)." = "塗りの列が線に沿うようになりました（ガイド付き塗り）。"
"The first distance is on the first line of the corner (the older line)." = "1つ目の距離は角の1本目の線 (先に描いた線) にあります。"
"The first line is a header" = "1 行目は見出し"
"The font cannot be read." = "フォントを読み込めません。"
"The font was not converted: {}" = "フォントを変換できませんでした: {}"
"The found designs and their numbers, for a spreadsheet." = "見つかったデザインとその数値（表計算ソフト用）。"
"The height of the block." = "ブロックの高さ。"
"The height of the capital letters." = "大文字の高さ。"
"The height of the largest initial." = "最も大きいイニシャルの高さ。"
"The help topics, and a search that answers questions from them. F1 on a button opens its help." = "ヘルプトピックと、そこから質問に答える検索。ボタン上で F1 を押すとそのヘルプが開きます。"
"The knife line does not cut the objects." = "ナイフの線がオブジェクトを切断しません。"
"The last color sews four crosses: the marks to put the rhinestone template in place. Pull them out after the press." = "最後の色で 4 つのクロスを縫います: ラインストーンのテンプレートを置くための目印です。プレス後に抜き取ってください。"
"The last stone cannot go; delete the object." = "最後のストーンは削除できません。オブジェクトを削除してください。"
"The length of each stitch. Short stitches follow curves better; long stitches are faster." = "各ステッチの長さ。短いステッチは曲線によく沿い、長いステッチは速く縫えます。"
"The letters of an embroidery font keep their own stitch types." = "刺繍フォントの文字は独自のステッチの種類を保ちます。"
"The letters sew in the order of the text, each part as it comes." = "文字はテキストの順に縫い、各部分は出てくる順に縫います。"
"The library index is not saved: {}" = "ライブラリーの索引を保存できませんでした: {}"
"The library shows the designs in your design folders and their subfolders." = "ライブラリーには、デザインフォルダーとそのサブフォルダーのデザインが表示されます。"
"The line is now the baseline. Reshape tool: drag its nodes to change it." = "線がベースラインになりました。形状編集ツール: ノードをドラッグして変更します。"
"The line is now the guide of the fill rows (Florentine)." = "線がフィルの列のガイドになりました（フローレンタイン）。"
"The line that the letters stand on." = "文字が乗る線。"
"The line to mirror about has no length." = "ミラーの軸の線の長さが0です。"
"The lines now split the fill rows (user split)." = "線がフィルの列を分割するようになりました（ユーザー分割）。"
"The lines of the corner are in one line." = "角の線が一直線上にあります。"
"The lowest number of spools to keep." = "残しておく最低の本数。"
"The machine has the threads of this design on its needles now." = "ミシンの針に、このデザインの糸が通っている状態になりました。"
"The machine of the design is not known." = "デザインのミシンが不明です。"
"The machine sets the speed." = "ミシンが速度を決めています。"
"The machine sews this object at its slow speed (small lettering, metallic thread). Only U01 files keep it." = "ミシンはこのオブジェクトを低速で縫います（小さな文字、メタリック糸）。U01 ファイルだけがこれを保持します。"
"The machine stops after the selected objects, for example to put on appliqué fabric." = "選択したオブジェクトの後でミシンが止まります。例: アップリケの生地を置くため。"
"The machine stops after the tack-down, so you can cut away the fabric outside it." = "押さえ縫いの後でミシンが止まり、外側の生地を切り取れます。"
"The machine stops after this object, for example to put on appliqué fabric" = "このオブジェクトの後でミシンが止まります。例: アップリケの生地を置くため"
"The motif library: use a motif for the selected lines, columns or fills, or make a motif from the selected objects." = "モチーフライブラリー: 選択した線、コラム、フィルにモチーフを使うか、選択したオブジェクトからモチーフを作ります。"
"The nearest letter next. The parts of each letter sew with as few trims as possible: a travel stitch where the next stitches cover it." = "次は一番近い文字です。各文字の部分はできるだけ少ない糸切りで縫います：次のステッチが隠す所は渡り縫いにします。"
"The needle goes to the start point before the first stitch, and to the end point after the last trim. No stitch sews there." = "針は最初のステッチの前に開始点へ、最後の糸切りの後に終了点へ移動します。そこではステッチを縫いません。"
"The needle of this thread. Auto keeps a thread on the needle that has it and puts a new thread on a free needle." = "この糸の針です。自動では、糸が通っている針はそのまま使い、新しい糸は空いている針に通します。"
"The needles of a multi-needle machine: the number of needles, the needle of each color, and the threads to put on before the start." = "多針ミシンの針: 針の数、各色の針、開始前に通す糸。"
"The needles of {}." = "{} の針。"
"The net of free-standing lace: open rows in two directions, each sewn there and back, so the threads lock where they cross." = "フリースタンディングレースの網：2 方向の粗い列。各列を往復で縫うので、交わる所で糸が締まります。"
"The number of lines, the line itself included." = "線の数（元の線を含む）。"
"The offset is larger than the radius of an arc." = "オフセットが円弧の半径より大きいです。"
"The offset is larger than the radius." = "オフセットが半径より大きいです。"
"The offset must be a distance more than 0." = "オフセットは0より大きい距離にしてください。"
"The operator sets the speed: hooping the pieces of all heads takes longer than one piece sews." = "オペレーターが速度を決めています: 全ヘッド分の枠張りが、1枚を縫う時間より長くかかります。"
"The order number (else the file name) as a barcode, so a shop system or a phone can find the order. Code 39 holds capital letters, digits and - . $ / + % only." = "注文番号 (なければファイル名) をバーコードにし、店舗システムやスマートフォンで注文を探せるようにします。Code 39 は大文字、数字、- . $ / + % だけを扱います。"
"The order of this design. The worksheet, the approval sheet and the quote show it, and it is saved with the design." = "このデザインの注文です。作業シート、承認シート、見積もりに表示され、デザインと一緒に保存されます。"
"The outline is too small for a hole {} mm inside it." = "輪郭が小さすぎて、内側 {} mm に穴を作れません。"
"The pattern does not make a block (it is too small or too large)." = "模様からブロックを作れません（小さすぎるか大きすぎます）。"
"The pattern of tiles that the line goes along. The size is the length of one side of a tile." = "線が沿うタイルの模様。大きさはタイルの 1 辺の長さです。"
"The picture could not be made." = "画像を作成できませんでした。"
"The picture has {} colors now." = "画像の色数は {} 色になりました。"
"The picture is open in another program ({}). Save it there: the backdrop changes here." = "画像はほかのプログラム（{}）で開いています。そこで保存すると、ここの下絵が変わります。"
"The picture is too large for the free memory. Make it smaller in a picture program, or close other programs." = "画像が大きすぎて空きメモリに収まりません。画像編集ソフトで小さくするか、ほかのプログラムを閉じてください。"
"The picture is {} × {} pixels at this detail." = "この細かさでは画像は {} × {} ピクセルです。"
"The picture shows the stitches. Go back to change a step." = "画像にステッチが表示されます。手順を変えるには戻ります。"
"The pieces that the machine sews at a time." = "ミシンが同時に縫う枚数。"
"The preview failed with these settings. Change a setting to try again." = "この設定ではプレビューを作れませんでした。設定を変えてもう一度試してください。"
"The price of 1000 stitches of one piece." = "1枚の1000針あたりの価格。"
"The price of an order from your price lists, the run time on your machine, and a quote sheet for the customer." = "価格表による注文の価格、ミシンでの生産時間、お客様向けの見積書。"
"The price of one garment, if you supply them. 0: the customer supplies them." = "衣類を用意する場合の1枚の価格。0: お客様が用意します。"
"The production worksheet and the approval sheet as they print. Save them as PDF." = "印刷される生産作業シートと承認シート。PDF として保存します。"
"The program keeps the stick and the folder for this machine: the next Send to USB goes there at once." = "このミシンの USB メモリーとフォルダーを記憶します: 次回の USB へ送信ではすぐにそこへ送ります。"
"The quantity is the quantity of Order Details. The bobbin thread is not in the list." = "数量は注文の詳細の数量です。下糸はリストに含まれません。"
"The radius is too large for these lines." = "この線には半径が大きすぎます。"
"The radius must be more than 0." = "半径は0より大きくしてください。"
"The radius of the baseline circle." = "ベースラインの円の半径。"
"The region or curve of {} links is gone." = "{} 個のリンクの領域または曲線がありません。"
"The region or curve of {} made objects is gone. They stay as they are; Unlink ends their link." = "作成したオブジェクト {} 個の領域または曲線がありません。そのまま残ります。「リンク解除」でリンクを終了します。"
"The rhinestone template: a hole for each stone, a little larger than the stone, and registration marks, at real size. SVG or DXF for a cutter, or PDF on paper." = "ラインストーンのテンプレート: ストーンごとにストーンより少し大きい穴と合わせマークを実寸で。カッター用の SVG または DXF、または紙用の PDF。"
"The ribbon" = "リボン"
"The rows are split where they cross these lines. To add lines, select the fill and lines, then Edit > Stitch Types > Split Lines." = "列はこれらの線と交わる位置で分割されます。線を追加するには、フィルと線を選択し、編集 > ステッチの種類 > 分割線。"
"The rows bend like a ball: large in the middle, small at the edge." = "列が球のように曲がります: 中央で大きく、縁で小さく。"
"The rows bend like the guide line. To set it, select the fill and a line, then Edit > Stitch Types > Guide Line." = "列がガイド線のように曲がります。設定するには、フィルと線を選択し、編集 > ステッチの種類 > ガイド線。"
"The scale must be more than 0." = "倍率は0より大きくしてください。"
"The script \"{}\" ran. It changed nothing." = "スクリプト \"{}\" を実行しました。変更はありません。"
"The script \"{}\" ran. Undo takes back its changes." = "スクリプト \"{}\" を実行しました。元に戻すで変更を取り消せます。"
"The script \"{}\" stopped: {}" = "スクリプト \"{}\" が停止しました: {}"
"The script gets the {} selected objects." = "スクリプトは選択した {} 個のオブジェクトを使います。"
"The script works on all the design (nothing is selected)." = "スクリプトはデザイン全体に対して動きます (何も選択されていません)。"
"The selected lines become cut lines for the cutting needles of a cutwork kit. Each part of a line goes to the needle whose blade has its direction; each needle is a color, so the machine stops to change the needle." = "選択した線がカットワークキットのカット針の切り線になります。線の各部分は、その向きの刃をもつ針に割り当てられます。針ごとに 1 色なので、ミシンは針を替えるために止まります。"
"The selected lines repeated over a quilt block, or a meander over it. A block larger than the hoop sews in hoopings, and the lines of two hoopings meet." = "選択した線をキルトブロック全体にくり返します。またはブロック全体にメアンダーを縫います。フープより大きいブロックは複数回のフープで縫い、2 回のフープの線がつながります。"
"The selected lines, columns, vectors and stone runs go the other way. The start and end points change places; motifs, borders and stone runs start at the other end." = "選択した線、コラム、ベクター、ストーン列の向きを反転します。開始点と終了点が入れ替わり、モチーフ、縁取り、ストーン列は反対側の端から始まります。"
"The selected object uses: {}" = "選択したオブジェクトが使っているもの: {}"
"The selected objects become this letter of the alphabet." = "選択したオブジェクトがアルファベットのこの文字になります。"
"The selected objects get the current properties." = "選択したオブジェクトに現在のプロパティが適用されます。"
"The selected objects stay; the result comes after them." = "選択したオブジェクトは残り、結果はその後に入ります。"
"The selected objects, in their colors, become the design of this key." = "選択したオブジェクトが、その色のままこのキーのデザインになります。"
"The selected stone runs and fills become single stones at the same places. Reshape then moves each stone, and Delete in Reshape removes one." = "選択したストーン列とストーンフィルが、同じ位置の個別のストーンになります。形状編集で各ストーンを動かし、形状編集中の Delete で 1 つずつ削除できます。"
"The selection has no holes." = "選択範囲に穴はありません。"
"The selection has no links." = "選択範囲にリンクはありません。"
"The selection has the current properties already" = "選択範囲はすでに現在のプロパティです"
"The selection has the settings of \"{}\" already, or no object of its types" = "選択範囲はすでに「{}」の設定であるか、その種類のオブジェクトがありません"
"The settings of Quick simplify." = "簡易シンプル化の設定。"
"The shape of this letter was changed by hand." = "この文字の形は手で変更されています。"
"The size is the sewable field (where the needle can go), not the frame." = "サイズは枠ではなく、縫製可能なフィールド（針が届く範囲）です。"
"The size of all text and buttons. Ctrl+Plus and Ctrl+Minus change it too." = "すべての文字とボタンのサイズ。Ctrl+プラスと Ctrl+マイナスでも変更できます。"
"The size of the cells of the grid. All cross-stitch objects on this grid change." = "グリッドのセルのサイズ。このグリッド上のすべてのクロスステッチオブジェクトが変わります。"
"The size of this letter." = "この文字のサイズ。"
"The sketch has no closed regions yet." = "スケッチにはまだ閉じた領域がありません。"
"The sketch has no closed regions." = "スケッチに閉じた領域がありません。"
"The sketch has no such point or curve." = "スケッチにその点や曲線はありません。"
"The sketch sets this size already: the dimension is driven (in parentheses). Right-click it to make it driving." = "このサイズはスケッチですでに決まっています。寸法は従属です (かっこ内)。右クリックで駆動にできます。"
"The sketch was scaled: the lengths of the expressions are × {}." = "スケッチは拡大縮小されています。式の長さは × {} です。"
"The space between the edges of two stones next to each other" = "隣り合う 2 つのストーンの縁の間隔"
"The space between the field edge and the stitches." = "フィールドの縁とステッチの間隔。"
"The space between the initials and the border." = "イニシャルと縁取りの間隔。"
"The space between the selection and its mirror copy." = "選択範囲とそのミラーコピーの間隔。"
"The space between the shapes and the fill." = "形と塗りの間のすき間。"
"The space between two columns." = "2 つの列の間隔。"
"The space between two copies side by side (0: they join)." = "横に並ぶ 2 つのコピーの間のすき間（0：つながります）。"
"The space between two rows of copies." = "コピーの 2 つの列の間のすき間。"
"The space between two rows." = "2 つの行の間隔。"
"The spacing changes from start to end, for shading. Custom: set the spacing (× the set spacing) at points along the object." = "陰影のために、間隔を始点から終点へ変えます。カスタム: オブジェクトに沿った点で間隔（設定間隔の倍率）を設定します。"
"The spacing must be a distance." = "間隔は距離にしてください。"
"The speed of the machine and the time of color changes, trims and stops (for the sew time), and how DST and TAP files tell the machine to trim." = "ミシンの速度と、色替え、糸切り、停止の時間（縫製時間用）、および DST と TAP ファイルでのミシンへの糸切りの指示方法。"
"The stitch angle changes evenly along the column, also where the stitch angle lines turn it sharply." = "ステッチ角度がコラムに沿って均等に変わります。ステッチ角度線で急に曲がる場所も同様です。"
"The stitch cache key is (id, revision). Undo restores the old revision." = "ステッチキャッシュのキーは（ID、リビジョン）です。元に戻すと古いリビジョンに戻ります。"
"The stitch of each color, in sew order (the first sews first, under the others)." = "縫い順での各色のステッチ（最初の色を最初に、ほかの色の下に縫います）。"
"The stitch price includes this many threads." = "針数の価格に含まれる糸の数。"
"The stitch settings are the current properties; the thread is the current thread." = "ステッチ設定は現在のプロパティ、糸は現在の糸です。"
"The stitch settings that new objects get. The property bar changes them while a drawing tool is active." = "新しいオブジェクトが受け取るステッチ設定。描画ツールの使用中はプロパティバーで変更します。"
"The stitch type of the selected fills." = "選択したフィルのステッチの種類。"
"The stitch type of the selected satin columns and of lines with a width." = "選択したサテンコラムと幅のある線のステッチの種類。"
"The stitch type of this letter. As the object: the stitch type of the lettering." = "この文字のステッチの種類。オブジェクトと同じ: 文字オブジェクトのステッチの種類。"
"The stitches as lines in the thread colors, at real size, for vector programs." = "ベクタープログラム用の、糸色の線で実寸のステッチ。"
"The stitches go at the fill angle again." = "ステッチは再びフィルの角度になります。"
"The stitches of the selected objects become a motif. The left and right middle of their box are its reference points." = "選択したオブジェクトのステッチがモチーフになります。そのボックスの左右の中央が基準点です。"
"The stock has all the thread for the order." = "在庫で注文の糸がすべてまかなえます。"
"The stone size: SS (stone size) number and diameter" = "ストーンのサイズ: SS（ストーンサイズ）番号と直径"
"The stripes go out from the first stripe to the last and back, as in most tartans." = "多くのタータンと同じように、縞は最初の縞から最後の縞へ進み、また戻ります。"
"The stripes of one repeat: a color code and a count for each, for example K4 R24 K24 Y4." = "1 回の繰り返しの縞：縞ごとに色のコードと本数。例：K4 R24 K24 Y4。"
