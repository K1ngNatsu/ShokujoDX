"Select the lines of the pattern, or choose a meander for the block." = "Wählen Sie die Linien des Musters, oder wählen Sie einen Mäander für den Block."
"Select the lines to cut." = "Wählen Sie die Linien zum Schneiden."
"Select the lines to make centerlines." = "Wählen Sie die Linien aus, die Mittellinien werden sollen."
