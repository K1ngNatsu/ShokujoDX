"Select the object that the stitch cursor is in." = "Das Objekt auswählen, in dem der Stichcursor steht."
"Select the objects inside a freehand line. Drag around them." = "Die Objekte innerhalb einer Freihandlinie auswählen. Ziehen Sie um sie herum."
