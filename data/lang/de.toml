"Same Width" = "Gleiche Breite"
"Same-color blocks can join. Optimize moves objects only where no overlapping object is in the way, so what is on top stays on top." = "Blöcke gleicher Farbe können sich verbinden. Optimieren verschiebt Objekte nur, wo kein überlappendes Objekt im Weg ist, so bleibt oben, was oben ist."
"Satin" = "Satin"
"Satin Between" = "Satin dazwischen"
"Satin Line" = "Satinlinie"
"Satin across the shape over more satin layers, so it stands up." = "Satin quer über die Form über weiteren Satinlagen, damit er erhaben steht."
"Satin column" = "Satinsäule"
"Satin column by pairs: click a point on one side, then the matching point on the other, pair by pair. Right click for curve points. Enter: finish." = "Satinsäule nach Paaren: Klicken Sie einen Punkt auf einer Seite, dann den passenden Punkt auf der anderen, Paar für Paar. Rechtsklick für Kurvenpunkte. Eingabetaste: fertig."
"Satin column made between the two curves." = "Satinsäule zwischen den zwei Kurven erstellt."
"Satin column of fixed width along a line. Left click: corner. Right click: curve point. Enter: finish." = "Satinsäule fester Breite entlang einer Linie. Linksklick: Ecke. Rechtsklick: Kurvenpunkt. Eingabe: fertig."
"Satin column: click one side, Enter, then the other side, Enter. The satin fills the space between them. Right click: curve point." = "Satinsäule: Klicken Sie eine Seite, Eingabetaste, dann die andere Seite, Eingabetaste. Der Satin füllt den Raum zwischen ihnen. Rechtsklick: Kurvenpunkt."
"Satin columns" = "Satinsäulen"
"Satin over more satin layers, so the column stands up from the fabric. Best up to 7 mm wide." = "Satin über weiteren Satinlagen, damit die Säule vom Stoff absteht. Am besten bis 7 mm Breite."
"Satin ring. Drag corner to corner. Set the width in the property bar." = "Satinring. Ziehen Sie von Ecke zu Ecke. Die Breite steht in der Eigenschaftsleiste."
"Satin rows with the needle points in a pattern that bends with the column (flexi split)." = "Satinreihen mit den Einstichpunkten in einem Muster, das sich mit der Säule biegt (Flexi-Split)."
"Satin stitches longer than this get extra needle points, so that they do not snag." = "Satinstiche, die länger sind als dies, erhalten zusätzliche Einstichpunkte, damit sie nicht hängen bleiben."
