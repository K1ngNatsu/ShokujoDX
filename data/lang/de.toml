"Run time" = "Laufzeit"
"Running line" = "Laufstichlinie"
"Running lines" = "Laufstichlinien"
"Running stitch line drawn by hand. Drag; the line is smoothed." = "Steppstichlinie, von Hand gezeichnet. Ziehen; die Linie wird geglättet."
