"Select two or more appliqué objects to combine." = "Wählen Sie zwei oder mehr Applikationsobjekte zum Kombinieren."
"Select two or more objects to group them." = "Wählen Sie zwei oder mehr Objekte, um sie zu gruppieren."
"Select vector objects first." = "Wählen Sie zuerst Vektorobjekte aus."
