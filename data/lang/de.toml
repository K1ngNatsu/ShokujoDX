"The design \"{}\"" = "Das Design „{}“"
"The design ({} × {} mm) is larger than all hoops that Auto hoop can use." = "Das Design ({} × {} mm) ist größer als alle Rahmen, die der automatische Rahmen verwenden kann."
"The design has more threads than the machine has needles. At each thread change (*) the machine stops, and the operator puts the next thread on the needle." = "Das Design hat mehr Fäden, als die Maschine Nadeln hat. Bei jedem Fadenwechsel (*) hält die Maschine an, und die Bedienung fädelt den nächsten Faden in die Nadel ein."
"The design has more threads than the machine has needles: {} thread changes. See Design > Needles." = "Das Design hat mehr Fäden, als die Maschine Nadeln hat: {} Fadenwechsel. Siehe Design > Nadeln."
"The design has no cross stitch. Draw some with Specialty > Cross Stitch first." = "Das Design hat keinen Kreuzstich. Zeichnen Sie zuerst welchen mit Spezial > Kreuzstich."
"The design has no hoopings. Use Hooping > Auto Layout." = "Das Design hat keine Einspannungen. Verwenden Sie Einspannen > Automatisches Layout."
"The design has no rhinestones." = "Das Design hat keine Strasssteine."
"The design has no shapes to write." = "Das Design hat keine Formen zum Schreiben."
"The design has no stitches to put in hoopings." = "Das Design hat keine Stiche, die in Einspannungen kommen."
"The design has no stitches yet." = "Das Design hat noch keine Stiche."
"The design is at {} of the {}." = "Das Design ist auf: {} ({})."
"The design is empty." = "Das Design ist leer."
"The designs in your design folders: thumbnails, search, sort and group. Open a design, make a new design from one, print a catalog." = "Die Designs in Ihren Designordnern: Miniaturen, Suche, Sortierung und Gruppen. Ein Design öffnen, aus einem ein neues erstellen, einen Katalog drucken."
"The designs that you open and save show here." = "Die Designs, die Sie öffnen und speichern, erscheinen hier."
"The direction line must go through the column." = "Die Richtungslinie muss durch die Säule gehen."
"The direction of the light: 0° from the right, 90° from the top, 135° from the top left." = "Die Richtung des Lichts: 0° von rechts, 90° von oben, 135° von oben links."
"The direction of the stitch rows." = "Die Richtung der Stichreihen."
"The distance between lines, as a part of the normal line distance of the font." = "Der Abstand zwischen den Zeilen, als Teil des normalen Zeilenabstands der Schrift."
"The distance between stitches. A smaller value gives more stitches and a denser cover." = "Der Abstand zwischen den Stichen. Ein kleinerer Wert gibt mehr Stiche und eine dichtere Deckung."
"The distance between the lines of the fill." = "Der Abstand zwischen den Linien der Füllung."
"The distance between the lines of the meander." = "Der Abstand zwischen den Linien des Mäanders."
"The distance between the repeats of the pattern along the column." = "Der Abstand zwischen den Wiederholungen des Musters entlang der Säule."
"The distance between two cuts of the needle along the line." = "Der Abstand zwischen zwei Schnitten der Nadel entlang der Linie."
"The distance between two lines." = "Der Abstand zwischen zwei Linien."
"The distance between two outlines." = "Der Abstand zwischen zwei Umrissen."
"The distance from the middle of the selection to the center, which is below it." = "Der Abstand von der Mitte der Auswahl zum Drehpunkt, der darunter liegt."
"The distance is too large for these lines." = "Der Abstand ist für diese Linien zu groß."
"The distance must be more than 0." = "Der Abstand muss größer als 0 sein."
"The distance of the first line from the shapes." = "Der Abstand der ersten Linie von den Formen."
"The distance of the first outline from the objects." = "Der Abstand des ersten Umrisses von den Objekten."
"The draw tools make vector artwork (no stitches) in place of embroidery objects." = "Die Zeichenwerkzeuge erstellen Vektorgrafik (ohne Stiche) statt Stickobjekte."
"The edge stitches end at random distances, for fur or grass. 0: off." = "Die Randstiche enden in zufälligen Abständen, für Fell oder Gras. 0: aus."
"The extension of this curve meets no other curve." = "Die Verlängerung dieser Kurve trifft keine andere Kurve."
"The fabric color inside the hoop. It changes with the colorway." = "Die Stofffarbe im Rahmen. Sie ändert sich mit der Farbvariante."
"The fabric color of this piece" = "Die Stofffarbe dieses Teils"
"The fabric sets the density, pull compensation and underlay of satin and fill stitches." = "Der Stoff legt Dichte, Zugausgleich und Unterlage der Satin- und Füllstiche fest."
"The files of the output profile (machine files, worksheets, pictures) for each selected design, in a folder." = "Die Dateien des Ausgabeprofils (Maschinendateien, Arbeitsblätter, Bilder) für jedes ausgewählte Design, in einem Ordner."
"The fill angle follows the line. For stitches that turn with the line, set the stitch type to Satin first." = "Der Füllwinkel folgt der Linie. Für Stiche, die mit der Linie drehen, stellen Sie zuerst die Stichart auf Satin."
"The fill rows now follow the lines (guided fill)." = "Die Füllreihen folgen jetzt den Linien (geführte Füllung)."
"The first distance is on the first line of the corner (the older line)." = "Der erste Abstand liegt auf der ersten Linie der Ecke (der älteren Linie)."
"The first line is a header" = "Die erste Zeile ist eine Überschrift"
"The font cannot be read." = "Die Schrift kann nicht gelesen werden."
"The font was not converted: {}" = "Die Schrift wurde nicht umgewandelt: {}"
"The found designs and their numbers, for a spreadsheet." = "Die gefundenen Designs und ihre Werte, für eine Tabellenkalkulation."
"The height of the block." = "Die Höhe des Blocks."
"The height of the capital letters." = "Die Höhe der Großbuchstaben."
"The height of the largest initial." = "Die Höhe der größten Initiale."
"The help topics, and a search that answers questions from them. F1 on a button opens its help." = "Die Hilfethemen und eine Suche, die Fragen daraus beantwortet. F1 auf einer Schaltfläche öffnet ihre Hilfe."
"The knife line does not cut the objects." = "Die Messerlinie schneidet die Objekte nicht."
"The last color sews four crosses: the marks to put the rhinestone template in place. Pull them out after the press." = "Die letzte Farbe stickt vier Kreuze: die Marken zum Platzieren der Strassvorlage. Ziehen Sie sie nach dem Pressen heraus."
"The last stone cannot go; delete the object." = "Der letzte Stein kann nicht entfernt werden; löschen Sie das Objekt."
"The length of each stitch. Short stitches follow curves better; long stitches are faster." = "Die Länge jedes Stichs. Kurze Stiche folgen Kurven besser; lange Stiche sind schneller."
"The letters of an embroidery font keep their own stitch types." = "Die Buchstaben einer Stickschrift behalten ihre eigenen Sticharten."
"The letters sew in the order of the text, each part as it comes." = "Die Buchstaben werden in der Reihenfolge des Textes gestickt, jedes Teil, wie es kommt."
"The library index is not saved: {}" = "Der Bibliotheksindex wurde nicht gespeichert: {}"
"The library shows the designs in your design folders and their subfolders." = "Die Bibliothek zeigt die Designs in Ihren Designordnern und deren Unterordnern."
"The line is now the baseline. Reshape tool: drag its nodes to change it." = "Die Linie ist jetzt die Grundlinie. Werkzeug Umformen: Ziehen Sie ihre Knoten, um sie zu ändern."
"The line is now the guide of the fill rows (Florentine)." = "Die Linie ist jetzt die Führung der Füllreihen (Florentiner)."
"The line that the letters stand on." = "Die Linie, auf der die Buchstaben stehen."
"The line to mirror about has no length." = "Die Spiegellinie hat keine Länge."
"The lines now split the fill rows (user split)." = "Die Linien teilen jetzt die Füllreihen (eigene Teilung)."
"The lines of the corner are in one line." = "Die Linien der Ecke liegen auf einer Geraden."
"The lowest number of spools to keep." = "Die kleinste Zahl von Spulen, die Sie behalten wollen."
"The machine has the threads of this design on its needles now." = "Die Maschine hat jetzt die Fäden dieses Designs auf ihren Nadeln."
"The machine of the design is not known." = "Die Maschine des Designs ist nicht bekannt."
"The machine sets the speed." = "Die Maschine bestimmt das Tempo."
"The machine sews this object at its slow speed (small lettering, metallic thread). Only U01 files keep it." = "Die Maschine stickt dieses Objekt in ihrem langsamen Tempo (kleine Schrift, Metallicgarn). Nur U01-Dateien behalten das."
"The machine stops after the selected objects, for example to put on appliqué fabric." = "Die Maschine hält nach den ausgewählten Objekten an, zum Beispiel zum Auflegen des Applikationsstoffs."
"The machine stops after the tack-down, so you can cut away the fabric outside it." = "Die Maschine hält nach dem Heftstich an, damit Sie den Stoff außerhalb wegschneiden können."
"The machine stops after this object, for example to put on appliqué fabric" = "Die Maschine hält nach diesem Objekt an, zum Beispiel zum Auflegen des Applikationsstoffs"
"The motif library: use a motif for the selected lines, columns or fills, or make a motif from the selected objects." = "Die Motivbibliothek: ein Motiv für die ausgewählten Linien, Säulen oder Füllungen verwenden, oder ein Motiv aus den ausgewählten Objekten erstellen."
"The nearest letter next. The parts of each letter sew with as few trims as possible: a travel stitch where the next stitches cover it." = "Der nächstgelegene Buchstabe als Nächstes. Die Teile jedes Buchstabens werden mit möglichst wenigen Fadenschnitten gestickt: ein Verbindungsstich, wo die nächsten Stiche ihn bedecken."
"The needle goes to the start point before the first stitch, and to the end point after the last trim. No stitch sews there." = "Die Nadel fährt vor dem ersten Stich zum Anfangspunkt und nach dem letzten Fadenschnitt zum Endpunkt. Dort wird kein Stich gestickt."
"The needle of this thread. Auto keeps a thread on the needle that has it and puts a new thread on a free needle." = "Die Nadel dieses Fadens. Auto lässt einen Faden auf der Nadel, die ihn hat, und legt einen neuen Faden auf eine freie Nadel."
"The needles of a multi-needle machine: the number of needles, the needle of each color, and the threads to put on before the start." = "Die Nadeln einer Mehrnadelmaschine: die Zahl der Nadeln, die Nadel jeder Farbe und die Fäden, die vor dem Start einzufädeln sind."
"The needles of {}." = "Die Nadeln von {}."
"The net of free-standing lace: open rows in two directions, each sewn there and back, so the threads lock where they cross." = "Das Netz freistehender Spitze: offene Reihen in zwei Richtungen, jede hin und zurück genäht, damit sich die Fäden an den Kreuzungen verriegeln."
"The number of lines, the line itself included." = "Die Zahl der Linien, die Linie selbst eingeschlossen."
"The offset is larger than the radius of an arc." = "Der Versatz ist größer als der Radius eines Bogens."
"The offset is larger than the radius." = "Der Versatz ist größer als der Radius."
"The offset must be a distance more than 0." = "Der Versatz muss ein Abstand größer als 0 sein."
"The operator sets the speed: hooping the pieces of all heads takes longer than one piece sews." = "Die Bedienung bestimmt das Tempo: Das Einspannen der Stücke aller Köpfe dauert länger, als ein Stück zum Sticken braucht."
"The order number (else the file name) as a barcode, so a shop system or a phone can find the order. Code 39 holds capital letters, digits and - . $ / + % only." = "Die Auftragsnummer (sonst der Dateiname) als Barcode, damit ein Ladensystem oder ein Telefon den Auftrag findet. Code 39 enthält nur Großbuchstaben, Ziffern und - . $ / + %."
"The order of this design. The worksheet, the approval sheet and the quote show it, and it is saved with the design." = "Der Auftrag dieses Designs. Das Arbeitsblatt, das Freigabeblatt und das Angebot zeigen ihn, und er wird mit dem Design gespeichert."
"The outline is too small for a hole {} mm inside it." = "Der Umriss ist zu klein für ein Loch {} mm innerhalb."
"The pattern does not make a block (it is too small or too large)." = "Das Muster ergibt keinen Block (es ist zu klein oder zu groß)."
"The pattern of tiles that the line goes along. The size is the length of one side of a tile." = "Das Kachelmuster, dem die Linie folgt. Die Größe ist die Länge einer Seite einer Kachel."
"The picture could not be made." = "Das Bild konnte nicht erstellt werden."
"The picture has {} colors now." = "Das Bild hat jetzt {} Farben."
"The picture is open in another program ({}). Save it there: the backdrop changes here." = "Das Bild ist in einem anderen Programm geöffnet ({}). Speichern Sie es dort: Der Hintergrund ändert sich hier."
"The picture is too large for the free memory. Make it smaller in a picture program, or close other programs." = "Das Bild ist zu groß für den freien Arbeitsspeicher. Verkleinern Sie es in einem Bildprogramm, oder schließen Sie andere Programme."
"The picture is {} × {} pixels at this detail." = "Das Bild hat bei diesem Detail {} × {} Pixel."
"The picture shows the stitches. Go back to change a step." = "Das Bild zeigt die Stiche. Gehen Sie zurück, um einen Schritt zu ändern."
"The pieces that the machine sews at a time." = "Die Stücke, die die Maschine gleichzeitig stickt."
"The preview failed with these settings. Change a setting to try again." = "Die Vorschau ist mit diesen Einstellungen fehlgeschlagen. Ändern Sie eine Einstellung, um es erneut zu versuchen."
"The price of 1000 stitches of one piece." = "Der Preis von 1000 Stichen eines Stücks."
"The price of an order from your price lists, the run time on your machine, and a quote sheet for the customer." = "Der Preis eines Auftrags aus Ihren Preislisten, die Laufzeit auf Ihrer Maschine und ein Angebotsblatt für den Kunden."
"The price of one garment, if you supply them. 0: the customer supplies them." = "Der Preis eines Kleidungsstücks, wenn Sie sie liefern. 0: Der Kunde liefert sie."
"The production worksheet and the approval sheet as they print. Save them as PDF." = "Das Produktions-Arbeitsblatt und das Freigabeblatt, wie sie gedruckt werden. Speichern Sie sie als PDF."
"The program keeps the stick and the folder for this machine: the next Send to USB goes there at once." = "Das Programm merkt sich den Stick und den Ordner für diese Maschine: Das nächste Auf USB senden geht sofort dorthin."
"The quantity is the quantity of Order Details. The bobbin thread is not in the list." = "Die Menge ist die Menge der Auftragsdetails. Der Unterfaden ist nicht in der Liste."
"The radius is too large for these lines." = "Der Radius ist für diese Linien zu groß."
"The radius must be more than 0." = "Der Radius muss größer als 0 sein."
"The radius of the baseline circle." = "Der Radius des Grundlinienkreises."
"The region or curve of {} links is gone." = "Der Bereich oder die Kurve von {} Verknüpfungen ist weg."
"The region or curve of {} made objects is gone. They stay as they are; Unlink ends their link." = "Der Bereich oder die Kurve von {} erstellten Objekten ist weg. Sie bleiben, wie sie sind; Verknüpfung lösen beendet ihre Verknüpfung."
"The rhinestone template: a hole for each stone, a little larger than the stone, and registration marks, at real size. SVG or DXF for a cutter, or PDF on paper." = "Die Strassvorlage: ein Loch für jeden Stein, etwas größer als der Stein, und Passmarken, in wahrer Größe. SVG oder DXF für einen Schneideplotter, oder PDF auf Papier."
"The ribbon" = "Das Menüband"
"The rows are split where they cross these lines. To add lines, select the fill and lines, then Edit > Stitch Types > Split Lines." = "Die Reihen werden geteilt, wo sie diese Linien kreuzen. Um Linien hinzuzufügen, wählen Sie die Füllung und die Linien, dann Bearbeiten > Sticharten > Teilungslinien."
"The rows bend like a ball: large in the middle, small at the edge." = "Die Reihen biegen sich wie eine Kugel: groß in der Mitte, klein am Rand."
"The rows bend like the guide line. To set it, select the fill and a line, then Edit > Stitch Types > Guide Line." = "Die Reihen biegen sich wie die Führungslinie. Zum Festlegen wählen Sie die Füllung und eine Linie, dann Bearbeiten > Sticharten > Führungslinie."
"The scale must be more than 0." = "Die Skalierung muss größer als 0 sein."
"The script \"{}\" ran. It changed nothing." = "Das Skript \"{}\" lief. Es hat nichts geändert."
"The script \"{}\" ran. Undo takes back its changes." = "Das Skript \"{}\" lief. Rückgängig nimmt seine Änderungen zurück."
"The script \"{}\" stopped: {}" = "Das Skript \"{}\" wurde angehalten: {}"
"The script gets the {} selected objects." = "Das Skript erhält die {} ausgewählten Objekte."
"The script works on all the design (nothing is selected)." = "Das Skript arbeitet am ganzen Design (nichts ist ausgewählt)."
"The selected lines become cut lines for the cutting needles of a cutwork kit. Each part of a line goes to the needle whose blade has its direction; each needle is a color, so the machine stops to change the needle." = "Die gewählten Linien werden Schnittlinien für die Schneidnadeln eines Cutwork-Sets. Jeder Teil einer Linie geht an die Nadel, deren Klinge seine Richtung hat; jede Nadel ist eine Farbe, also hält die Maschine zum Nadelwechsel an."
"The selected lines repeated over a quilt block, or a meander over it. A block larger than the hoop sews in hoopings, and the lines of two hoopings meet." = "Die gewählten Linien über einen Quiltblock wiederholt, oder ein Mäander darüber. Ein Block, der größer als der Rahmen ist, wird in Einspannungen genäht, und die Linien zweier Einspannungen treffen sich."
"The selected lines, columns, vectors and stone runs go the other way. The start and end points change places; motifs, borders and stone runs start at the other end." = "Die ausgewählten Linien, Säulen, Vektoren und Steinreihen laufen in die andere Richtung. Anfangs- und Endpunkt tauschen die Plätze; Motive, Ränder und Steinreihen beginnen am anderen Ende."
"The selected object uses: {}" = "Das ausgewählte Objekt verwendet: {}"
"The selected objects become this letter of the alphabet." = "Die ausgewählten Objekte werden dieser Buchstabe des Alphabets."
"The selected objects get the current properties." = "Die ausgewählten Objekte erhalten die aktuellen Eigenschaften."
"The selected objects stay; the result comes after them." = "Die ausgewählten Objekte bleiben; das Ergebnis kommt danach."
"The selected objects, in their colors, become the design of this key." = "Die ausgewählten Objekte werden in ihren Farben das Design dieser Taste."
"The selected stone runs and fills become single stones at the same places. Reshape then moves each stone, and Delete in Reshape removes one." = "Die ausgewählten Steinreihen und -füllungen werden einzelne Steine an denselben Stellen. Umformen verschiebt dann jeden Stein, und Entf in Umformen entfernt einen."
"The selection has no holes." = "Die Auswahl hat keine Löcher."
"The selection has no links." = "Die Auswahl hat keine Verknüpfungen."
"The selection has the current properties already" = "Die Auswahl hat die aktuellen Eigenschaften schon"
"The selection has the settings of \"{}\" already, or no object of its types" = "Die Auswahl hat die Einstellungen von „{}“ schon, oder kein Objekt ihrer Arten"
"The settings of Quick simplify." = "Die Einstellungen von Schnell vereinfachen."
"The shape of this letter was changed by hand." = "Die Form dieses Buchstabens wurde von Hand geändert."
"The size is the sewable field (where the needle can go), not the frame." = "Die Größe ist das Stickfeld (wohin die Nadel kann), nicht der Rahmen."
"The size of all text and buttons. Ctrl+Plus and Ctrl+Minus change it too." = "Die Größe aller Texte und Schaltflächen. Strg+Plus und Strg+Minus ändern sie auch."
"The size of the cells of the grid. All cross-stitch objects on this grid change." = "Die Größe der Rasterzellen. Alle Kreuzstichobjekte auf diesem Raster ändern sich."
"The size of this letter." = "Die Größe dieses Buchstabens."
"The sketch has no closed regions yet." = "Die Skizze hat noch keine geschlossenen Bereiche."
"The sketch has no closed regions." = "Die Skizze hat keine geschlossenen Bereiche."
"The sketch has no such point or curve." = "Die Skizze hat keinen solchen Punkt und keine solche Kurve."
"The sketch sets this size already: the dimension is driven (in parentheses). Right-click it to make it driving." = "Die Skizze legt diese Größe schon fest: Das Maß ist abgeleitet (in Klammern). Klicken Sie mit der rechten Maustaste darauf, um es steuernd zu machen."
"The sketch was scaled: the lengths of the expressions are × {}." = "Die Skizze wurde skaliert: die Längen der Ausdrücke sind × {}."
"The space between the edges of two stones next to each other" = "Der Abstand zwischen den Kanten zweier benachbarter Steine"
"The space between the field edge and the stitches." = "Der Abstand zwischen Feldrand und Stichen."
"The space between the initials and the border." = "Der Abstand zwischen den Initialen und dem Rand."
"The space between the selection and its mirror copy." = "Der Abstand zwischen der Auswahl und ihrer Spiegelkopie."
"The space between the shapes and the fill." = "Der Abstand zwischen den Formen und der Füllung."
"The space between two columns." = "Der Abstand zwischen zwei Spalten."
"The space between two copies side by side (0: they join)." = "Der Abstand zwischen zwei Kopien nebeneinander (0: sie verbinden sich)."
"The space between two rows of copies." = "Der Abstand zwischen zwei Reihen von Kopien."
"The space between two rows." = "Der Abstand zwischen zwei Reihen."
"The spacing changes from start to end, for shading. Custom: set the spacing (× the set spacing) at points along the object." = "Der Abstand ändert sich von Anfang bis Ende, für Schattierung. Benutzerdefiniert: Setzen Sie den Abstand (× dem gesetzten Abstand) an Punkten entlang des Objekts."
"The spacing must be a distance." = "Der Abstand muss eine Länge sein."
"The speed of the machine and the time of color changes, trims and stops (for the sew time), and how DST and TAP files tell the machine to trim." = "Das Tempo der Maschine und die Zeit von Farbwechseln, Fadenschnitten und Stopps (für die Stickzeit), und wie DST- und TAP-Dateien der Maschine den Fadenschnitt melden."
"The stitch angle changes evenly along the column, also where the stitch angle lines turn it sharply." = "Der Stichwinkel ändert sich gleichmäßig entlang der Säule, auch wo die Stichwinkellinien ihn scharf drehen."
"The stitch cache key is (id, revision). Undo restores the old revision." = "Der Schlüssel des Stich-Caches ist (ID, Revision). Rückgängig stellt die alte Revision wieder her."
"The stitch of each color, in sew order (the first sews first, under the others)." = "Der Stich jeder Farbe, in Stickreihenfolge (die erste wird zuerst gestickt, unter den anderen)."
"The stitch price includes this many threads." = "Der Stichpreis enthält so viele Fäden."
"The stitch settings are the current properties; the thread is the current thread." = "Die Stichwerte sind die aktuellen Eigenschaften; der Faden ist der aktuelle Faden."
"The stitch settings that new objects get. The property bar changes them while a drawing tool is active." = "Die Sticheinstellungen, die neue Objekte erhalten. Die Eigenschaftsleiste ändert sie, solange ein Zeichenwerkzeug aktiv ist."
"The stitch type of the selected fills." = "Die Stichart der ausgewählten Füllungen."
"The stitch type of the selected satin columns and of lines with a width." = "Die Stichart der ausgewählten Satinsäulen und der Linien mit Breite."
"The stitch type of this letter. As the object: the stitch type of the lettering." = "Die Stichart dieses Buchstabens. Wie das Objekt: die Stichart der Schrift."
"The stitches as lines in the thread colors, at real size, for vector programs." = "Die Stiche als Linien in den Garnfarben, in wahrer Größe, für Vektorprogramme."
"The stitches go at the fill angle again." = "Die Stiche laufen wieder im Füllwinkel."
"The stitches of the selected objects become a motif. The left and right middle of their box are its reference points." = "Die Stiche der ausgewählten Objekte werden ein Motiv. Die linke und rechte Mitte ihres Rechtecks sind seine Bezugspunkte."
"The stock has all the thread for the order." = "Das Lager hat allen Faden für den Auftrag."
"The stone size: SS (stone size) number and diameter" = "Die Steingröße: SS-Nummer (Steingröße) und Durchmesser"
"The stripes go out from the first stripe to the last and back, as in most tartans." = "Die Streifen gehen vom ersten bis zum letzten Streifen und zurück, wie bei den meisten Tartans."
"The stripes of one repeat: a color code and a count for each, for example K4 R24 K24 Y4." = "Die Streifen eines Rapports: ein Farbcode und eine Fadenzahl für jeden, zum Beispiel K4 R24 K24 Y4."
"The style has the settings of the selection already" = "Der Stil hat die Einstellungen der Auswahl schon"
"The template \"{}\" has parameters. Type the values for the new design:" = "Die Vorlage „{}“ hat Parameter. Geben Sie die Werte für das neue Design ein:"
"The text before the cost, for example $ or €. A price of 0 gives no cost in Design info." = "Der Text vor den Kosten, zum Beispiel $ oder €. Ein Preis von 0 zeigt keine Kosten in der Designinfo."
"The thread colors next to the machine files, for DST and the other formats with no colors." = "Die Garnfarben neben den Maschinendateien, für DST und die anderen Formate ohne Farben."
"The threads that you have. Each spool that you began counts as one." = "Die Fäden, die Sie haben. Jede angefangene Spule zählt als eine."
"The threads that you have: color matching with only them, the nearest thread in stock for each thread of the design, and the threads to buy for the order." = "Die Fäden, die Sie haben: Farbabgleich nur mit ihnen, der nächste Faden auf Lager für jeden Faden des Designs und die Fäden, die für den Auftrag zu kaufen sind."
"The tools to draw a design, letter it and send it to the machine. Help > Simple Mode changes it again." = "Die Werkzeuge, um ein Design zu zeichnen, zu beschriften und an die Maschine zu senden. Hilfe > Einfacher Modus ändert es wieder."
"The trace stays linked: it is cut again when its objects move." = "Die Kontur bleibt verknüpft: Sie wird neu geschnitten, wenn ihre Objekte sich bewegen."
"The two sides of the selected satin columns change places, with the settings of each side." = "Die zwei Seiten der ausgewählten Satinsäulen tauschen die Plätze, mit den Einstellungen jeder Seite."
"The units of the program (also in Options). You can type a value in other units, for example 2 in or 50 mm." = "Die Einheiten des Programms (auch in den Optionen). Sie können einen Wert in anderen Einheiten eingeben, zum Beispiel 2 in oder 50 mm."
