"A blend sews the shape in two or more colors. Each layer goes from dense to open (or back), so the colors mix." = "Ein Farbverlauf stickt die Form in zwei oder mehr Farben. Jede Lage geht von dicht zu offen (oder zurück), so mischen sich die Farben."
"A border round the selected objects in a thread you choose, or a gap with no stitches, cut out of the objects under them." = "Ein Rand um die ausgewählten Objekte in einem Garn Ihrer Wahl, oder eine Lücke ohne Stiche, aus den Objekten darunter ausgeschnitten."
"A border round the selected objects, a gap round them, or both, cut out of the objects under them. In the gap the fabric shows." = "Ein Rand um die ausgewählten Objekte, eine Lücke um sie oder beides, aus den Objekten darunter ausgeschnitten. In der Lücke ist der Stoff sichtbar."
"A circle has no ends to extend." = "Ein Kreis hat keine Enden zum Verlängern."
"A click on one object selects all of the group." = "Ein Klick auf ein Objekt wählt die ganze Gruppe aus."
"A copy of the current colors, to change" = "Eine Kopie der aktuellen Farben, zum Ändern"
"A copy of the current colors, to change. Each colorway is one color version of the design." = "Eine Kopie der aktuellen Farben, zum Ändern. Jede Farbvariante ist eine Farbversion des Designs."
"A cross in each cell of a grid, in a few thread colors. Print the chart with Specialty > Chart." = "Ein Kreuz in jeder Zelle eines Rasters, in wenigen Garnfarben. Drucken Sie das Zählmuster mit Spezial > Zählmuster."
"A detail inside an area up to this size sews on top of the area, and the area has no hole there. 0: each detail is a hole." = "Ein Detail in einer Fläche bis zu dieser Größe wird über der Fläche gestickt, und die Fläche hat dort kein Loch. 0: jedes Detail ist ein Loch."
"A driven dimension only shows the size (in parentheses); it does not change the sketch." = "Ein abgeleitetes Maß zeigt nur die Größe (in Klammern); es ändert die Skizze nicht."
"A duplicate goes this far right and down." = "Ein Duplikat wird so weit nach rechts und unten versetzt."
"A favorite style (Design > Favorites, in all designs). Click: not a favorite." = "Ein Lieblingsstil (Design > Favoriten, in allen Designs). Klick: kein Favorit mehr."
"A fill for each color of the sett, with the shape of the selected fill." = "Eine Füllung für jede Farbe des Setts, mit der Form der gewählten Füllung."
"A fill for each color, with the shape of the selected fill." = "Eine Füllung für jede Farbe, mit der Form der gewählten Füllung."
"A fill of the background round the selected shapes and appliqué, so they stand up. Select a border shape too, or the fill is a box round them." = "Eine Füllung des Hintergrunds um die gewählten Formen und Applikationen, damit sie hervortreten. Wählen Sie auch eine Randform, sonst ist die Füllung ein Rechteck um sie."
"A fillet or a chamfer needs a corner of two lines." = "Eine Rundung oder eine Fase braucht eine Ecke aus zwei Linien."
"A full-window screen for a shop: a product, a name, a font and a color, then save, output or send to USB." = "Ein Vollbild für einen Laden: ein Produkt, ein Name, eine Schrift und eine Farbe, dann speichern, ausgeben oder auf USB senden."
"A light fill under the design that holds down the pile of towels and fur. Use a thread of the fabric color." = "Eine leichte Füllung unter dem Design, die den Flor von Handtüchern und Plüsch niederhält. Nehmen Sie ein Garn in der Stofffarbe."
"A light fill under the selected objects (or the whole design) that holds down the pile of towels and fur. It sews first, in a thread of its own." = "Eine leichte Füllung unter den ausgewählten Objekten (oder dem ganzen Design), die den Flor von Handtüchern und Plüsch niederhält. Sie wird zuerst gestickt, mit eigenem Garn."
"A line and a circle or an arc, or two circles or arcs, that touch." = "Eine Linie und ein Kreis oder Bogen, oder zwei Kreise oder Bögen, die sich berühren."
"A line has no length." = "Eine Linie hat keine Länge."
"A line needs two nodes and a closed shape three." = "Eine Linie braucht zwei Knoten, eine geschlossene Form drei."
"A line of rhinestones. Left click: corner. Right click: curve point. Enter: finish. The stones go from end to end." = "Eine Linie aus Strasssteinen. Linksklick: Ecke. Rechtsklick: Kurvenpunkt. Eingabe: fertig. Die Steine gehen von Ende zu Ende."
"A line of the corner has no length." = "Eine Linie der Ecke hat keine Länge."
"A line that shows where to put the fabric. The machine stops after it." = "Eine Linie, die zeigt, wohin der Stoff kommt. Danach hält die Maschine an."
"A line, or two points, horizontal." = "Eine Linie oder zwei Punkte waagerecht."
"A line, or two points, vertical." = "Eine Linie oder zwei Punkte senkrecht."
"A line, then a stop to lay a cord on it, then an open zigzag that holds the cord down." = "Eine Linie, dann ein Stopp zum Auflegen einer Kordel, dann ein offener Zickzack, der die Kordel hält."
"A linked vector cannot become more than one {}: unlink it first (Artwork > Shaping > Unlink)." = "Ein verknüpfter Vektor kann nicht mehr als ein {} werden: Lösen Sie zuerst die Verknüpfung (Grafik > Formen > Verknüpfung lösen)."
"A long gap becomes a jump; the thread is not cut" = "Eine lange Lücke wird ein Sprung; der Faden wird nicht geschnitten"
"A longer text gets smaller, so that it is at most this wide." = "Ein längerer Text wird kleiner, so dass er höchstens so breit ist."
"A machine with one needle: the operator changes the thread at each color change. Set the number of needles if your machine has more." = "Eine Maschine mit einer Nadel: Bei jedem Farbwechsel wechselt die Bedienung den Faden. Stellen Sie die Zahl der Nadeln ein, wenn Ihre Maschine mehr hat."
"A meandering line that fills the shape and never crosses itself." = "Eine mäandernde Linie, die die Form füllt und sich nie kreuzt."
"A median of the pixels round each pixel: removes grain and keeps edges. 0: off." = "Ein Median der Pixel um jedes Pixel: entfernt Körnung und erhält Kanten. 0: aus."
"A motif repeated along the column, as high as the column is wide." = "Ein Motiv, wiederholt entlang der Säule, so hoch wie die Säule breit ist."
"A motif repeated along the line." = "Ein Motiv, wiederholt entlang der Linie."
"A new cell size starts a new grid." = "Eine neue Zellgröße beginnt ein neues Raster."
