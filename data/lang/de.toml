"Selected lines" = "Ausgewählte Linien"
"Selected stitch objects (from a machine file or a photo stitch) become fills of the area that their stitches cover, so they can be scaled and keep their density." = "Ausgewählte Stichobjekte (aus einer Maschinendatei oder einem Fotostich) werden Füllungen der Fläche, die ihre Stiche bedecken, damit sie sich skalieren lassen und ihre Dichte behalten."
"Selection" = "Auswahl"
