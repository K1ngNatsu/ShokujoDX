"Rows split where they cross lines that you draw. Select the fill and lines, then Edit > Stitch Types > Split Lines." = "Reihen, geteilt, wo sie von Ihnen gezeichnete Linien kreuzen. Wählen Sie die Füllung und die Linien, dann Bearbeiten > Sticharten > Teilungslinien."
"Rows that bend like a guide line. Select the fill and a line, then Edit > Stitch Types > Guide Line." = "Reihen, die sich wie eine Führungslinie biegen. Wählen Sie die Füllung und eine Linie, dann Bearbeiten > Sticharten > Führungslinie."
"Rows that change from one color to the next across the shape. Make a gradient of many colors in Edit > Stitch Types > Gradient." = "Reihen, die über die Form von einer Farbe zur nächsten wechseln. Einen Verlauf aus vielen Farben machen Sie unter Bearbeiten > Stichtypen > Verlauf."
