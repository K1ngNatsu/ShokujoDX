"Thread Chart" = "Carta de hilos"
"Thread Look" = "Aspecto de hilo"
"Thread Stock" = "Existencias de hilo"
"Thread builds up in {} places (more than {} layers)." = "El hilo se acumula en {} lugares (más de {} capas)."
"Thread builds up: {} layers on {} mm² (limit {}); View > Density Map shows it" = "El hilo se acumula: {} capas en {} mm² (límite {}); Vista > Mapa de densidad lo muestra"
"Thread change: the machine stops, and the operator puts this thread on the needle." = "Cambio de hilo: la máquina se detiene y el operador pone este hilo en la aguja."
"Thread changes (*)" = "Cambios de hilo (*)"
"Thread chart \"{}\" imported ({} threads)" = "Carta de hilos \"{}\" importada ({} hilos)"
