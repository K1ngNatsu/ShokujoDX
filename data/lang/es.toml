"Each object ends at the point nearest to the next one, which starts there" = "Cada objeto termina en el punto más cercano al siguiente, que empieza allí"
"Each object ends at the point nearest to the next one, which starts there." = "Cada objeto termina en el punto más cercano al siguiente, que empieza allí."
"Each object keeps its own settings, changed by the difference between the fabrics. Objects with no underlay or custom underlay keep their underlay." = "Cada objeto conserva sus propios ajustes, cambiados según la diferencia entre las telas. Los objetos sin base o con base personalizada conservan su base."
"Each stitch three times, so the line shows more." = "Cada puntada tres veces, para que la línea se vea más."
"Each used thread gets the nearest color of the chart in the Threads panel." = "Cada hilo usado toma el color más cercano de la carta del panel Hilos."
