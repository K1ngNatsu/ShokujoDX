"Each used thread takes the color of the next one" = "Cada hilo usado toma el color del siguiente"
"Each used thread takes the color of the next one. Do it again to try more combinations." = "Cada hilo usado toma el color del siguiente. Repita para probar más combinaciones."
"Each used thread that is not in stock gets the nearest thread in stock. ΔE is the color difference: under about 2.3 it does not show." = "Cada hilo usado que no está en existencias recibe el hilo en existencias más cercano. ΔE es la diferencia de color: por debajo de 2,3 aprox. no se nota."
"Each word must be in the name, file, folder, notes, threads or format.\nFilters: format:vp3,dst  folder:caps  colors:<4  stitches:1000-5000\nwidth:<100  height:>50  fits:<hoop>  error:yes  \"two words\"" = "Cada palabra debe estar en el nombre, archivo, carpeta, notas, hilos o formato.\nFiltros: format:vp3,dst  folder:caps  colors:<4  stitches:1000-5000\nwidth:<100  height:>50  fits:<hoop>  error:yes  \"dos palabras\""
