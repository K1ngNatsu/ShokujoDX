"The letters stand on a straight line." = "Las letras se apoyan en una línea recta."
"The letters stand on top of an arc. Drag the center of the arc to change it." = "Las letras se apoyan sobre un arco. Arrastre el centro del arco para cambiarlo."
"The library index is not saved: {}" = "El índice de la biblioteca no se guardó: {}"
"The library shows the designs in your design folders and their subfolders." = "La biblioteca muestra los diseños de sus carpetas de diseños y sus subcarpetas."
"The line is in two parts. Break Apart makes two objects." = "La línea está en dos partes. Separar hace dos objetos."
"The line is now the baseline. Reshape tool: drag its nodes to change it." = "La línea es ahora la línea base. Herramienta Remodelar: arrastre sus nodos para cambiarla."
"The line is now the guide of the fill rows (Florentine)." = "La línea es ahora la guía de las filas del relleno (florentino)."
"The line that the letters stand on." = "La línea sobre la que se apoyan las letras."
"The line to mirror about has no length." = "La línea de simetría no tiene longitud."
"The lines now split the fill rows (user split)." = "Las líneas dividen ahora las filas del relleno (división del usuario)."
"The lines of the corner are in one line." = "Las líneas de la esquina están en una misma recta."
"The list has no names." = "La lista no tiene nombres."
"The lowest number of spools to keep." = "El número mínimo de conos que conservar."
"The machine has the threads of this design on its needles now." = "La máquina tiene ahora los hilos de este diseño en sus agujas."
"The machine of the design is not known." = "No se conoce la máquina del diseño."
"The machine sets the speed." = "La máquina marca el ritmo."
"The machine sews this object at its slow speed (small lettering, metallic thread). Only U01 files keep it." = "La máquina borda este objeto a su velocidad lenta (letras pequeñas, hilo metálico). Solo los archivos U01 lo conservan."
"The machine stops after the selected objects, for example to put on appliqué fabric." = "La máquina se detiene después de los objetos seleccionados, por ejemplo para poner la tela de aplique."
"The machine stops after the tack-down, so you can cut away the fabric outside it." = "La máquina se detiene después de la fijación, para que pueda recortar la tela de fuera."
"The machine stops after this object, for example to put on appliqué fabric" = "La máquina se detiene después de este objeto, por ejemplo para poner la tela de aplique"
"The motif library: use a motif for the selected lines, columns or fills, or make a motif from the selected objects." = "La biblioteca de motivos: use un motivo para las líneas, columnas o rellenos seleccionados, o cree un motivo a partir de los objetos seleccionados."
"The name is in the font. The canvas shows your text in this font." = "El nombre está en la fuente. El lienzo muestra su texto en esta fuente."
"The name is larger than the place ({} × {} mm). Make it smaller." = "El nombre es más grande que la zona ({} × {} mm). Hágalo más pequeño."
"The nearest letter next. The parts of each letter sew with as few trims as possible: a travel stitch where the next stitches cover it." = "La letra más cercana a continuación. Las partes de cada letra se bordan con los menos cortes posibles: una puntada de traslado donde las puntadas siguientes la cubren."
"The needle goes to the start point before the first stitch, and to the end point after the last trim. No stitch sews there." = "La aguja va al punto de inicio antes de la primera puntada, y al punto final después del último corte. Ahí no se borda ninguna puntada."
"The needle of this thread. Auto keeps a thread on the needle that has it and puts a new thread on a free needle." = "La aguja de este hilo. Auto deja un hilo en la aguja que ya lo tiene y pone un hilo nuevo en una aguja libre."
"The needles of a multi-needle machine: the number of needles, the needle of each color, and the threads to put on before the start." = "Las agujas de una máquina multiaguja: el número de agujas, la aguja de cada color y los hilos que hay que poner antes de empezar."
"The needles of {}." = "Las agujas de {}."
"The net of free-standing lace: open rows in two directions, each sewn there and back, so the threads lock where they cross." = "La red del encaje independiente: filas abiertas en dos direcciones, cada una cosida de ida y vuelta, para que los hilos se bloqueen donde se cruzan."
"The number of lines, the line itself included." = "El número de líneas, incluida la propia línea."
"The offset is larger than the radius of an arc." = "El desplazamiento es mayor que el radio de un arco."
"The offset is larger than the radius." = "El desplazamiento es mayor que el radio."
"The offset must be a distance more than 0." = "El desplazamiento debe ser una distancia mayor que 0."
"The operator sets the speed: hooping the pieces of all heads takes longer than one piece sews." = "El operador marca el ritmo: enmarcar las piezas de todos los cabezales tarda más de lo que tarda en bordarse una pieza."
"The order number (else the file name) as a barcode, so a shop system or a phone can find the order. Code 39 holds capital letters, digits and - . $ / + % only." = "El número de pedido (o el nombre del archivo) como código de barras, para que un sistema de tienda o un teléfono encuentre el pedido. Code 39 solo admite mayúsculas, dígitos y - . $ / + %."
"The order of this design. The worksheet, the approval sheet and the quote show it, and it is saved with the design." = "El pedido de este diseño. La hoja de trabajo, la hoja de aprobación y el presupuesto lo muestran, y se guarda con el diseño."
"The outline is too small for a hole {} mm inside it." = "El contorno es demasiado pequeño para un agujero a {} mm dentro de él."
"The pattern does not make a block (it is too small or too large)." = "El patrón no forma un bloque (es demasiado pequeño o demasiado grande)."
"The pattern of tiles that the line goes along. The size is the length of one side of a tile." = "El patrón de mosaicos que sigue la línea. El tamaño es la longitud de un lado de un mosaico."
"The picture could not be made." = "No se pudo crear la imagen."
"The picture has {} colors now." = "La imagen tiene ahora {} colores."
"The picture is open in another program ({}). Save it there: the backdrop changes here." = "La imagen está abierta en otro programa ({}). Guárdela allí: el fondo cambia aquí."
"The picture is too large for the free memory. Make it smaller in a picture program, or close other programs." = "La imagen es demasiado grande para la memoria libre. Redúzcala en un programa de imágenes o cierre otros programas."
"The picture is {} × {} pixels at this detail." = "La imagen tiene {} × {} píxeles con este detalle."
"The picture shows the stitches. Go back to change a step." = "La imagen muestra las puntadas. Vuelva atrás para cambiar un paso."
"The pieces that the machine sews at a time." = "Las piezas que la máquina borda a la vez."
"The point that stays in place when you change the size here or with the handles on the canvas. Alt while you drag a handle: from the opposite side." = "El punto que se queda en su sitio cuando cambia el tamaño aquí o con los tiradores del lienzo. Alt mientras arrastra un tirador: desde el lado opuesto."
"The preview failed with these settings. Change a setting to try again." = "La vista previa falló con estos ajustes. Cambie un ajuste para intentarlo de nuevo."
"The price of 1000 stitches of one piece." = "El precio de 1000 puntadas de una pieza."
"The price of an order from your price lists, the run time on your machine, and a quote sheet for the customer." = "El precio de un pedido según sus listas de precios, el tiempo de producción en su máquina y una hoja de presupuesto para el cliente."
"The price of one garment, if you supply them. 0: the customer supplies them." = "El precio de una prenda, si usted las suministra. 0: el cliente las suministra."
"The production worksheet and the approval sheet as they print. Save them as PDF." = "La hoja de trabajo de producción y la hoja de aprobación tal como se imprimen. Guárdelas como PDF."
"The program cannot write .{} files." = "El programa no puede escribir archivos .{}."
"The program keeps the stick and the folder for this machine: the next Send to USB goes there at once." = "El programa recuerda la memoria y la carpeta para esta máquina: el siguiente Enviar a USB va allí directamente."
"The program stopped because of an error the last time it ran. Your work is in the automatic backups." = "El programa se detuvo por un error la última vez que se ejecutó. Su trabajo está en las copias de seguridad automáticas."
"The program stopped before the job ended." = "El programa se detuvo antes de que terminara el trabajo."
"The project file {} was not saved." = "El archivo de proyecto {} no se guardó."
"The quantity is the quantity of Order Details. The bobbin thread is not in the list." = "La cantidad es la de Detalles del pedido. El hilo de la bobina no está en la lista."
"The radius is too large for these lines." = "El radio es demasiado grande para estas líneas."
"The radius must be more than 0." = "El radio debe ser mayor que 0."
"The radius of the baseline circle." = "El radio del círculo de la línea base."
"The region or curve of {} links is gone." = "La región o curva de {} vínculos ya no existe."
"The region or curve of {} made objects is gone. They stay as they are; Unlink ends their link." = "La región o curva de {} objetos creados ya no existe. Quedan como están; Desvincular termina su vínculo."
"The rhinestone template: a hole for each stone, a little larger than the stone, and registration marks, at real size. SVG or DXF for a cutter, or PDF on paper." = "La plantilla de strass: un agujero por piedra, un poco más grande que la piedra, y marcas de registro, a tamaño real. SVG o DXF para un plóter, o PDF en papel."
"The ribbon" = "La cinta"
"The rows are split where they cross these lines. To add lines, select the fill and lines, then Edit > Stitch Types > Split Lines." = "Las filas se dividen donde cruzan estas líneas. Para añadir líneas, seleccione el relleno y las líneas, luego Editar > Tipos de puntada > Líneas de división."
"The rows bend like a ball: large in the middle, small at the edge." = "Las filas se curvan como una esfera: grandes en el centro, pequeñas en el borde."
"The rows bend like the guide line. To set it, select the fill and a line, then Edit > Stitch Types > Guide Line." = "Las filas se curvan como la línea guía. Para definirla, seleccione el relleno y una línea, luego Editar > Tipos de puntada > Línea guía."
"The scale must be more than 0." = "La escala debe ser mayor que 0."
"The script \"{}\" ran. It changed nothing." = "El script \"{}\" se ejecutó. No cambió nada."
"The script \"{}\" ran. Undo takes back its changes." = "El script \"{}\" se ejecutó. Deshacer revierte sus cambios."
"The script \"{}\" stopped: {}" = "El script \"{}\" se detuvo: {}"
"The script gets the {} selected objects." = "El script recibe los {} objetos seleccionados."
"The script works on all the design (nothing is selected)." = "El script trabaja con todo el diseño (no hay nada seleccionado)."
"The selected lines become cut lines for the cutting needles of a cutwork kit. Each part of a line goes to the needle whose blade has its direction; each needle is a color, so the machine stops to change the needle." = "Las líneas seleccionadas se convierten en líneas de corte para las agujas de corte de un juego de calado. Cada parte de una línea va a la aguja cuya cuchilla tiene su dirección; cada aguja es un color, así que la máquina se detiene para cambiar la aguja."
"The selected lines repeated over a quilt block, or a meander over it. A block larger than the hoop sews in hoopings, and the lines of two hoopings meet." = "Las líneas seleccionadas repetidas sobre un bloque de acolchado, o un meandro sobre él. Un bloque más grande que el bastidor se cose en varios bastidores, y las líneas de dos bastidores se unen."
"The selected lines, columns, vectors and stone runs go the other way. The start and end points change places; motifs, borders and stone runs start at the other end." = "Las líneas, columnas, vectores e hileras de piedras seleccionados van en sentido contrario. Los puntos de inicio y fin se intercambian; los motivos, bordes e hileras de piedras empiezan por el otro extremo."
"The selected object uses: {}" = "El objeto seleccionado usa: {}"
"The selected objects become this letter of the alphabet." = "Los objetos seleccionados pasan a ser esta letra del alfabeto."
"The selected objects get the current properties." = "Los objetos seleccionados reciben las propiedades actuales."
"The selected objects stay; the result comes after them." = "Los objetos seleccionados se conservan; el resultado va después de ellos."
"The selected objects, in their colors, become the design of this key." = "Los objetos seleccionados, en sus colores, pasan a ser el diseño de esta tecla."
"The selected stone runs and fills become single stones at the same places. Reshape then moves each stone, and Delete in Reshape removes one." = "Las hileras y rellenos de piedras seleccionados pasan a ser piedras sueltas en los mismos lugares. Remodelar mueve entonces cada piedra, y Supr en Remodelar quita una."
"The selection has no holes." = "La selección no tiene agujeros."
"The selection has no links." = "La selección no tiene vínculos."
"The selection has no size." = "La selección no tiene tamaño."
"The selection has the current properties already" = "La selección ya tiene las propiedades actuales"
"The selection has the settings of \"{}\" already, or no object of its types" = "La selección ya tiene los ajustes de \"{}\", o ningún objeto de sus tipos"
"The selection is now the design of \"{}\"." = "La selección es ahora el diseño de «{}»."
"The settings of Quick simplify." = "Los ajustes de Simplificación rápida."
"The settings when the window first opens." = "Los ajustes al abrir la ventana por primera vez."
"The shape of this letter was changed by hand." = "La forma de esta letra se cambió a mano."
"The shapes are smaller than one cell: no cross stitch. Use a smaller cell size." = "Las formas son más pequeñas que una celda: no hay punto de cruz. Use un tamaño de celda menor."
"The size is the sewable field (where the needle can go), not the frame." = "El tamaño es el campo bordable (donde puede ir la aguja), no el marco."
"The size of all text and buttons. Ctrl+Plus and Ctrl+Minus change it too." = "El tamaño de todo el texto y los botones. Ctrl+Más y Ctrl+Menos también lo cambian."
"The size of the cells of the grid. All cross-stitch objects on this grid change." = "El tamaño de las celdas de la cuadrícula. Cambian todos los objetos de punto de cruz de esta cuadrícula."
"The size of this letter." = "El tamaño de esta letra."
"The sketch has no closed regions yet." = "El boceto aún no tiene regiones cerradas."
"The sketch has no closed regions." = "El boceto no tiene regiones cerradas."
"The sketch has no such point or curve." = "El boceto no tiene ese punto o curva."
"The sketch sets this size already: the dimension is driven (in parentheses). Right-click it to make it driving." = "El boceto ya fija este tamaño: la cota es conducida (entre paréntesis). Haga clic derecho para hacerla conductora."
"The sketch was scaled: the lengths of the expressions are × {}." = "El boceto se escaló: las longitudes de las expresiones son × {}."
"The space between the edges of two stones next to each other" = "El espacio entre los bordes de dos piedras vecinas"
"The space between the field edge and the stitches." = "El espacio entre el borde del campo y las puntadas."
"The space between the initials and the border." = "El espacio entre las iniciales y el borde."
"The space between the selection and its mirror copy." = "El espacio entre la selección y su copia en espejo."
"The space between the shapes and the fill." = "El espacio entre las formas y el relleno."
"The space between two columns." = "El espacio entre dos columnas."
"The space between two copies side by side (0: they join)." = "El espacio entre dos copias una al lado de otra (0: se unen)."
"The space between two rows of copies." = "El espacio entre dos filas de copias."
"The space between two rows." = "El espacio entre dos filas."
"The spacing changes from start to end, for shading. Custom: set the spacing (× the set spacing) at points along the object." = "El espaciado cambia del inicio al fin, para sombrear. Personalizado: defina el espaciado (× el espaciado fijado) en puntos a lo largo del objeto."
"The spacing must be a distance." = "La separación debe ser una distancia."
"The speed of the machine and the time of color changes, trims and stops (for the sew time), and how DST and TAP files tell the machine to trim." = "La velocidad de la máquina y el tiempo de los cambios de color, cortes y paradas (para el tiempo de bordado), y cómo indican los archivos DST y TAP a la máquina que corte."
"The stick has {} free; the files need {}." = "La memoria tiene {} libres; los archivos necesitan {}."
"The stitch angle changes evenly along the column, also where the stitch angle lines turn it sharply." = "El ángulo de puntada cambia de forma uniforme a lo largo de la columna, también donde las líneas de ángulo lo giran bruscamente."
"The stitch cache key is (id, revision). Undo restores the old revision." = "La clave de la caché de puntadas es (id, revisión). Deshacer restaura la revisión anterior."
"The stitch of each color, in sew order (the first sews first, under the others)." = "La puntada de cada color, en orden de bordado (el primero se borda primero, debajo de los demás)."
"The stitch price includes this many threads." = "El precio de las puntadas incluye esta cantidad de hilos."
"The stitch settings are the current properties; the thread is the current thread." = "Los ajustes de puntada son las propiedades actuales; el hilo es el hilo actual."
"The stitch settings that new objects get. The property bar changes them while a drawing tool is active." = "Los ajustes de puntada que reciben los objetos nuevos. La barra de propiedades los cambia mientras una herramienta de dibujo está activa."
"The stitch type of the selected fills." = "El tipo de puntada de los rellenos seleccionados."
"The stitch type of the selected satin columns and of lines with a width." = "El tipo de puntada de las columnas de satén seleccionadas y de las líneas con ancho."
"The stitch type of this letter. As the object: the stitch type of the lettering." = "El tipo de puntada de esta letra. Como el objeto: el tipo de puntada de las letras."
"The stitches as lines in the thread colors, at real size, for vector programs." = "Las puntadas como líneas en los colores de hilo, a tamaño real, para programas vectoriales."
"The stitches go at the fill angle again." = "Las puntadas vuelven a ir con el ángulo del relleno."
"The stitches of the selected objects become a motif. The left and right middle of their box are its reference points." = "Las puntadas de los objetos seleccionados pasan a ser un motivo. Los centros izquierdo y derecho de su caja son sus puntos de referencia."
"The stock has all the thread for the order." = "Las existencias tienen todo el hilo para el pedido."
"The stone size: SS (stone size) number and diameter" = "El tamaño de la piedra: número SS (tamaño de piedra) y diámetro"
"The stripes go out from the first stripe to the last and back, as in most tartans." = "Las franjas van de la primera a la última y vuelven, como en la mayoría de los tartanes."
"The stripes of one repeat: a color code and a count for each, for example K4 R24 K24 Y4." = "Las franjas de una repetición: un código de color y un número de hilos para cada una, por ejemplo K4 R24 K24 Y4."
"The style has the settings of the selection already" = "El estilo ya tiene los ajustes de la selección"
"The template \"{}\" has parameters. Type the values for the new design:" = "La plantilla «{}» tiene parámetros. Escriba los valores para el diseño nuevo:"
"The text before the cost, for example $ or €. A price of 0 gives no cost in Design info." = "El texto antes del coste, por ejemplo $ o €. Un precio de 0 no muestra coste en Información del diseño."
"The thread colors next to the machine files, for DST and the other formats with no colors." = "Los colores de hilo junto a los archivos de máquina, para DST y los demás formatos sin colores."
"The threads that you have. Each spool that you began counts as one." = "Los hilos que tiene. Cada cono empezado cuenta como uno."
"The threads that you have: color matching with only them, the nearest thread in stock for each thread of the design, and the threads to buy for the order." = "Los hilos que tiene: ajuste de color solo con ellos, el hilo en existencias más cercano para cada hilo del diseño y los hilos que comprar para el pedido."
"The tools to draw a design, letter it and send it to the machine. Help > Simple Mode changes it again." = "Las herramientas para dibujar un diseño, añadirle letras y enviarlo a la máquina. Ayuda > Modo simple lo cambia otra vez."
"The trace stays linked: it is cut again when its objects move." = "El trazado queda vinculado: se vuelve a cortar cuando sus objetos se mueven."
"The two sides of the selected satin columns change places, with the settings of each side." = "Los dos lados de las columnas de satén seleccionadas se intercambian, con los ajustes de cada lado."
"The units of the program (also in Options). You can type a value in other units, for example 2 in or 50 mm." = "Las unidades del programa (también en Opciones). Puede escribir un valor en otras unidades, por ejemplo 2 in o 50 mm."
"The usual buttonhole: shirts, blouses and most woven fabrics." = "El ojal habitual: camisas, blusas y la mayoría de las telas planas."
"The version and build of the program, and the folder of the settings, backups and crash reports." = "La versión y la compilación del programa, y la carpeta de los ajustes, copias de seguridad e informes de fallo."
"The weave of the fabric of the design under the background color (Color tab)." = "La trama de la tela del diseño bajo el color de fondo (pestaña Color)."
"The width of the block." = "El ancho del bloque."
"The width of the border. 0: no border." = "El ancho del borde. 0: sin borde."
"The width of the column that the line sews as. The line is its middle." = "El ancho de la columna con la que se borda la línea. La línea es su centro."
"The width of the gap round the border (or round the objects with no border), where the fabric shows. 0: no gap." = "El ancho del hueco alrededor del borde (o alrededor de los objetos sin borde), donde se ve la tela. 0: sin hueco."
"The width of the line." = "El ancho de la línea."
"The width of the satin border." = "El ancho del borde de satén."
"The {} tools (the window is too narrow to show them all)" = "Las herramientas de {} (la ventana es demasiado estrecha para mostrarlas todas)"
"Then remove the background. Crop the picture first (Artwork > Picture) if only a part of it is wanted." = "Luego quite el fondo. Recorte primero la imagen (Arte > Imagen) si solo quiere una parte."
"Then use Mark keep and Mark remove where the edge is wrong: each mark cuts again." = "Luego use Marcar conservar y Marcar quitar donde el borde esté mal: cada marca vuelve a cortar."
"There can be {} favorite styles. Remove one first." = "Puede haber {} estilos favoritos. Quite uno primero."
"There can be {} more views. Close one first." = "Puede haber {} vistas más. Cierre una primero."
"There is no clipart folder." = "No hay carpeta de clipart."
"There is no folder for user fonts." = "No hay carpeta para fuentes del usuario."
"These formats have no trim code: a few short jumps tell the machine to cut the thread. Change them only if your machine does not cut, or cuts too often." = "Estos formatos no tienen código de corte: unos pocos saltos cortos indican a la máquina que corte el hilo. Cámbielos solo si su máquina no corta, o corta demasiado a menudo."
"These objects are already simple." = "Estos objetos ya son simples."
"This color also sews in block {}. Merge colors can join them when nothing overlaps." = "Este color también se borda en el bloque {}. Fusionar colores puede unirlos cuando nada se superpone."
"This color everywhere" = "Este color en todas partes"
"This constraint needs two lines." = "Esta restricción necesita dos líneas."
"This design" = "Este diseño"
"This dimension repeats or conflicts with others (gray or red)." = "Esta cota repite otras o entra en conflicto con ellas (gris o rojo)."
"This edit does not take splines yet." = "Esta edición aún no admite splines."
"This end joins another curve." = "Este extremo se une a otra curva."
"This fill sews the stripes of {}." = "Este relleno cose las franjas de {}."
"This font cannot be read." = "No se puede leer esta fuente."
"This is a test build. Save your work often, and send your notes with the feedback form." = "Esta es una versión de prueba. Guarde su trabajo a menudo y envíe sus notas con el formulario de comentarios."
"This line is {} mm. Print at 100 % (no fit to page)." = "Esta línea mide {} mm. Imprima al 100 % (sin ajustar a la página)."
"This value conflicts with other constraints (red)." = "Este valor está en conflicto con otras restricciones (rojo)."
"This view is closed." = "Esta vista está cerrada."
"This wizard turns the picture into embroidery, step by step. Each step shows its result on the right." = "Este asistente convierte la imagen en bordado, paso a paso. Cada paso muestra su resultado a la derecha."
