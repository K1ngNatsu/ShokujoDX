name: CI

# Windows and Ubuntu check each push and pull request. macOS minutes cost
# the most in a private repository, so macOS checks only a tag (v*) and a
# run by hand (Actions > CI > Run workflow); ADR 0060.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["windows-latest", "macos-latest", "ubuntu-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries for eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Engine crates must not depend on UI crates (docs/SPEC.md, rule 5) or
      # on C or C++ libraries (rule 9).
      - name: Engine crates have no UI and no C dependency
        shell: bash
        run: |
          for c in emb-geom emb-model emb-stitch emb-formats emb-render emb-letter emb-art emb-library; do
            if cargo tree -p "$c" -e normal --prefix none | grep -Eq '^(egui|eframe|winit|wgpu|egui_dock|emb-app|emb-cli) '; then
              echo "$c depends on a UI crate or a higher crate"; exit 1
            fi
            if cargo tree -p "$c" -e normal --prefix none | grep -Eq -- '-sys '; then
              echo "$c depends on a C library"; exit 1
            fi
          done
