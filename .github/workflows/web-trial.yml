# Builds the browser trial (roadmap P15, step 1; docs/design/p15-trial-report.md)
# and publishes it on GitHub Pages, for tests with friends. Only the branch
# trial/browser; the desktop program and its releases do not change.

name: Web trial

on:
  push:
    branches: [trial/browser]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-opt makes the program 15 % smaller, but not the download (gzip)
      # and not quicker (docs/design/p15-trial-report.md): no --opt here.
      - name: wasm-bindgen (the version of Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the page
        run: python3 tools/build-web.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
